  return `<div class="anexo-section">
    <h4>📎 Fotos & Arquivos <span style="font-size:.75rem;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-dim)"> – fotos, PDFs, contratos...</span></h4>
    <div class="anexo-grid" id="anexo-saved-${type}-${id}">${savedHtml}</div>
    <div class="anexo-grid" id="anexo-pending-grid"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
      <div class="anexo-add-btn" onclick="document.getElementById('_anexo-input').click()" title="Adicionar foto ou arquivo">
        <span style="font-size:1.5rem">📷</span><span>Adicionar</span>
      </div>
      <input type="file" id="_anexo-input" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv" style="display:none" onchange="onAnexoSelected(event,'${type}',${id})">
      ${saved.length?`<span style="font-size:.78rem;color:var(--text-muted)">${saved.length} arquivo${saved.length>1?'s':''} salvo${saved.length>1?'s':''}</span>`:''}
    </div>
  </div>`;
}

async function loadAnexoThumbs(type,id){
  const key=_anexoEntityKey(type);
  const record=id?db[key].find(x=>x.id==id):null;
  if(!record?.attachments)return;
  for(const a of record.attachments){
    if(a.type.startsWith('image/')){
      const blob=await idbGet(a.id);
      if(blob){const url=URL.createObjectURL(blob);const img=document.querySelector(`img[data-idbid="${a.id}"]`);if(img)img.src=url;}
    }
  }
}

function onAnexoSelected(event,type,id){
  const files=[...event.target.files];
  const grid=document.getElementById('anexo-pending-grid');if(!grid)return;
  files.forEach(file=>{
    if(file.size>15*1024*1024){toast('Arquivo muito grande (máx 15MB): '+file.name,'error');return;}
    const idx=_pendingAnexos.length;
    _pendingAnexos.push({file});
    const item=document.createElement('div');
    item.className='anexo-item';item.id='pending-anexo-'+idx;
    if(file.type.startsWith('image/')){
      const reader=new FileReader();
      reader.onload=e=>{item.innerHTML=`<img class="anexo-thumb anexo-pending-border" src="${e.target.result}" alt="${file.name}" title="${file.name}"><button class="anexo-del" onclick="removerAnexoPending(${idx})">✕</button>`;};
      reader.readAsDataURL(file);
    }else{
      item.innerHTML=`<div class="anexo-file anexo-pending-border"><span class="af-icon">${file.type==='application/pdf'?'📄':'📁'}</span><span class="af-ext">${file.name.split('.').pop().toUpperCase()}</span><span class="af-name">${file.name}</span></div><button class="anexo-del" onclick="removerAnexoPending(${idx})">✕</button>`;
    }
    grid.appendChild(item);
  });
  event.target.value='';
}

function removerAnexoPending(idx){
  _pendingAnexos[idx]=null;
  const el=document.getElementById('pending-anexo-'+idx);if(el)el.remove();
}

async function removerAnexoSalvo(type,id,anexoId){
  if(!confirm('Remover este arquivo?'))return;
  const key=_anexoEntityKey(type);
  const recIdx=db[key].findIndex(x=>x.id==id);if(recIdx<0)return;
  await idbDel(anexoId);
  db[key][recIdx].attachments=(db[key][recIdx].attachments||[]).filter(a=>a.id!==anexoId);
  salvar();
  const el=document.getElementById('anexo-s-'+anexoId);if(el)el.remove();
  toast('Arquivo removido.','success');
}

async function viewAnexo(idbId,name,type){
  const blob=await idbGet(idbId);
  if(!blob){toast('Arquivo não encontrado no dispositivo.','error');return;}
  const url=URL.createObjectURL(blob);
  if(type.startsWith('image/')||type==='application/pdf'){window.open(url,'_blank');}
  else{const a=document.createElement('a');a.href=url;a.download=name;a.click();}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

async function salvarAnexosPendentes(type,recordId){
  const key=_anexoEntityKey(type);
  const idx=db[key].findIndex(x=>x.id==recordId);if(idx<0)return;
  if(!db[key][idx].attachments)db[key][idx].attachments=[];
  for(const p of _pendingAnexos){
    if(!p)continue;
    const attId='att_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
    await idbSave(attId,p.file);
    db[key][idx].attachments.push({id:attId,name:p.file.name,type:p.file.type,size:p.file.size,date:today()});
  }
  _pendingAnexos=[];
  salvar();
}


// ===== HOUSECALL PRO CSV IMPORTER =====
let _hcpData = { clientes: null, jobs: null, estimates: null, invoices: null };

function _parseCSV(text) {
  // Normalize line endings
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const parseRow = line => {
    const res = []; let inQ = false; let cur = '';
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
      else if (ch===',' && !inQ) { res.push(cur.trim()); cur=''; }
      else cur += ch;
    }
    res.push(cur.trim()); return res;
  };
  const rawHeaders = parseRow(lines[0]);
  const headers = rawHeaders.map(h => h.toLowerCase().replace(/[\s\-\/]+/g,'_').replace(/[^a-z0-9_]/g,''));
  return lines.slice(1).map(line => {
    if (!line.trim()) return null;
    const vals = parseRow(line);
    const obj = {}; headers.forEach((h,i) => obj[h] = (vals[i]||'').trim()); return obj;
  }).filter(r => r && Object.values(r).some(v=>v));
}

function _hcpCol(row) {
  // Returns a function that tries multiple column name variants
  return (...keys) => {
    for (const k of keys) {
      const norm = k.toLowerCase().replace(/[\s\-\/]+/g,'_').replace(/[^a-z0-9_]/g,'');
      if (row[norm] !== undefined && row[norm] !== '') return row[norm];
    }
    return '';
  };
}

function _hcpParseDate(s) {
  if (!s) return '';
  // Try MM/DD/YYYY or YYYY-MM-DD or M/D/YYYY
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m1) return `${m1[3]}-${m1[1].padStart(2,'0')}-${m1[2].padStart(2,'0')}`;
  const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m2) return s.substring(0,10);
  return '';
}

function _hcpMoney(s) {
  if (!s) return 0;
  return parseFloat(s.toString().replace(/[$,\s]/g,'')) || 0;
}

function onHcpFile(event, tipo) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const rows = _parseCSV(e.target.result);
      _hcpData[tipo] = rows;
      const el = document.getElementById('hcp-preview-'+tipo);
      if (el) el.innerHTML = `<span style="color:#22c55e;font-weight:600">✅ ${rows.length} registros encontrados</span>` +
        (rows.length > 0 ? `<span style="color:var(--text-muted);margin-left:8px">Colunas: ${Object.keys(rows[0]).slice(0,5).join(', ')}${Object.keys(rows[0]).length>5?'...':''}</span>` : '');
    } catch(err) {
      const el = document.getElementById('hcp-preview-'+tipo);
      if (el) el.innerHTML = `<span style="color:#ef4444">❌ Erro ao ler arquivo: ${err.message}</span>`;
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function importarHCP() {
  const total = Object.values(_hcpData).filter(x=>x&&x.length>0).length;
  if (total === 0) { toast('Selecione ao menos um arquivo CSV para importar.','error'); return; }

  const counts = { clientes:0, jobs:0, estimates:0, invoices:0 };
  const erros = [];

  // STATUS HELPERS
  const statusOrdem = s => { s=(s||'').toLowerCase(); if(/complet|done|finish|conclu/.test(s))return'Concluído'; if(/progress|active|andamento|work/.test(s))return'Em Andamento'; if(/cancel/.test(s))return'Cancelado'; return'Agendado'; };
  const statusOrc = s => { s=(s||'').toLowerCase(); if(/approv|accept|won|aprovad/.test(s))return'Aprovado'; if(/declin|reject|lost|recusad/.test(s))return'Recusado'; return'Pendente'; };
  const statusInv = s => { s=(s||'').toLowerCase(); if(/paid|pago/.test(s))return'Pago'; if(/sent|enviad|open/.test(s))return'Enviado'; if(/cancel/.test(s))return'Cancelado'; return'Rascunho'; };

  // FIND CLIENT BY NAME
  const findCliente = name => {
    if(!name) return null;
    const nl = name.toLowerCase().trim();
    const e = db.clientes.find(c=>c.nome.toLowerCase()===nl); if(e) return e.id;
    const p = db.clientes.find(c=>c.nome.toLowerCase().includes(nl)||nl.includes(c.nome.toLowerCase())); return p?p.id:null;
  };

  // 1. IMPORT CUSTOMERS
  if (_hcpData.clientes && _hcpData.clientes.length > 0) {
    for (const r of _hcpData.clientes) {
      const g = _hcpCol(r);
      let nome = g('customer_name','full_name','name','contact_name') ||
                 (g('first_name','firstname') + ' ' + g('last_name','lastname')).trim();
      const empresa = g('company','company_name','business_name');
      if (!nome && empresa) nome = empresa;
      if (!nome) continue;
      if (db.clientes.some(c=>c.nome.toLowerCase()===nome.toLowerCase())) continue; // skip dup
      db.clientes.push({
        id: nextId('clientes'),
        nome,
        telefone: g('mobile_number','mobile','phone','cell_phone','home_number','work_number'),
        email: g('email','email_address'),
        endereco: [g('address','street','street_address'), g('city'), g('state'), g('zip','zip_code','postal_code')].filter(x=>x).join(', '),
        obs: [empresa?`Empresa: ${empresa}`:'', g('notes','customer_notes','tags')].filter(x=>x).join(' | ') || ''
      });
      counts.clientes++;
    }
  }

  // 2. IMPORT JOBS → Ordens de Serviço
  if (_hcpData.jobs && _hcpData.jobs.length > 0) {
    for (const r of _hcpData.jobs) {
      const g = _hcpCol(r);
      const clienteNome = g('customer_name','customer','client_name','client');
      const clienteId = findCliente(clienteNome);
      if (!clienteId) { erros.push(`Job sem cliente: "${clienteNome||'(vazio)'}"`); continue; }
      db.ordens.push({
        id: nextId('ordens'),
        clienteId,
        orcamentoId: null,
        servico: 'outro',
        tecnico: g('assigned_employee','employee','technician','tech','assigned_to','assigned'),
        dataInicio: _hcpParseDate(g('job_start_date','start_date','scheduled_date','date','created_at')) || today(),
        dataFim: _hcpParseDate(g('job_end_date','end_date','completed_date','completion_date')) || '',
        status: statusOrdem(g('status','job_status')),
        obs: [g('job_description','description','notes','work_order','job_type'), g('address','street')?`Endereço: ${g('address','street')} ${g('city')} ${g('state')} ${g('zip','zip_code')}`.trim():''].filter(x=>x).join('\n') || '',
        attachments: []
      });
      counts.jobs++;
    }
  }

  // 3. IMPORT ESTIMATES → Orçamentos
  if (_hcpData.estimates && _hcpData.estimates.length > 0) {
    for (const r of _hcpData.estimates) {
      const g = _hcpCol(r);
      const clienteNome = g('customer_name','customer','client_name','client');
      const clienteId = findCliente(clienteNome);
      if (!clienteId) { erros.push(`Estimate sem cliente: "${clienteNome||'(vazio)'}"`); continue; }
      const total = _hcpMoney(g('total','estimate_total','amount','subtotal','grand_total'));
      db.orcamentos.push({
        id: nextId('orcamentos'),
        clienteId,
        servico: 'outro',
        data: _hcpParseDate(g('estimate_date','date','created_date','created_at')) || today(),
        validade: _hcpParseDate(g('valid_until','expiration_date','expire_date')) || '',
        status: statusOrc(g('status','estimate_status')),
        desconto: _hcpMoney(g('discount','discount_amount')),
        descricao: g('description','notes','job_description','message') || '',
        itens: [{ tipo:'outro', desc: g('description','job_type','line_item','notes') || 'Serviço importado', qty:1, preco:total }],
        attachments: []
      });
      counts.estimates++;
    }
  }

  // 4. IMPORT INVOICES
  if (_hcpData.invoices && _hcpData.invoices.length > 0) {
    for (const r of _hcpData.invoices) {
      const g = _hcpCol(r);
      const clienteNome = g('customer_name','customer','client_name','client');
      const clienteId = findCliente(clienteNome);
      if (!clienteId) { erros.push(`Invoice sem cliente: "${clienteNome||'(vazio)'}"`); continue; }
      const desconto = _hcpMoney(g('discount','discount_amount'));
      const total = _hcpMoney(g('total','invoice_total','amount','grand_total','balance_due'));
      const subtotal = _hcpMoney(g('subtotal','sub_total')) || (total + desconto);
      db.invoices.push({
        id: nextId('invoices'),
        clienteId,
        servico: 'outro',
        dataEmissao: _hcpParseDate(g('invoice_date','date','created_date','created_at')) || today(),
        dataVenc: _hcpParseDate(g('due_date','payment_due')) || '',
        status: statusInv(g('status','invoice_status','payment_status')),
        paymentTerms: g('terms','payment_terms') || 'Net 30',
        tecnico: g('technician','tech','employee','assigned_to') || '',
        notas: g('notes','description','memo','job_description') || '',
        itens: [{ tipo:'outro', desc: g('description','job_type','line_item') || 'Serviço', qty:1, preco:subtotal }],
        subtotal,
        desconto,
        total,
        attachments: []
      });
      counts.invoices++;
    }
  }

  salvar();

  const linhas = [
    counts.clientes > 0 ? `✅ <strong>${counts.clientes}</strong> clientes importados` : '',
    counts.jobs > 0 ? `✅ <strong>${counts.jobs}</strong> ordens de serviço importadas` : '',
    counts.estimates > 0 ? `✅ <strong>${counts.estimates}</strong> orçamentos importados` : '',
    counts.invoices > 0 ? `✅ <strong>${counts.invoices}</strong> invoices importadas` : ''
  ].filter(x=>x).join('<br>');

  abrirModal('📥 Importação Concluída', `
    <div style="padding:16px 0">
      <div style="font-size:2.5rem;text-align:center;margin-bottom:14px">🎉</div>
      <p style="font-size:.95rem;color:var(--text);line-height:2;margin-bottom:${erros.length>0?'14':'0'}px">${linhas||'<span style="color:var(--text-muted)">Nenhum registro importado.</span>'}</p>
      ${erros.length>0?`<div style="background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.25);border-radius:8px;padding:12px">
        <p style="font-size:.82rem;font-weight:600;color:#ffc107;margin:0 0 8px">⚠️ ${erros.length} registro${erros.length>1?'s':''} ignorado${erros.length>1?'s':''} (cliente não encontrado)</p>
        <p style="font-size:.78rem;color:var(--text-muted);margin:0 0 8px">Dica: importe os <strong>Clientes primeiro</strong>, depois os outros dados.</p>
        <details><summary style="font-size:.78rem;cursor:pointer;color:var(--text-muted)">Ver lista (${erros.length})</summary>
          <ul style="font-size:.76rem;color:var(--text-muted);margin:8px 0 0;padding-left:16px;max-height:140px;overflow-y:auto">${erros.slice(0,50).map(e=>`<li>${e}</li>`).join('')}${erros.length>50?`<li>...e mais ${erros.length-50}</li>`:''}</ul>
        </details>
      </div>`:''}
    </div>
  `, '<button class="btn btn-primary" onclick="fecharModal()">OK</button>');

  _hcpData = { clientes:null, jobs:null, estimates:null, invoices:null };
}

function abrirModal(titulo, corpo, footer, maxW='620px') {
  const html=`<div class="modal-overlay" onclick="fecharModal(event)" id="modal-overlay">
    <div class="modal" style="max-width:${maxW}">
      <div class="modal-header"><h3>${titulo}</h3><button class="modal-close" onclick="fecharModal()">×</button></div>
      <div class="modal-body">${corpo}</div>
      <div class="modal-footer">${footer}</div>
    </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function fecharModal(event) {
  if(event&&event.target.id!=='modal-overlay')return;
  const o=document.getElementById('modal-overlay'); if(o)o.remove();
}

// ===== LEADS & CAMPANHAS =====
const LEAD_STAGES = ['Novo','Contato Feito','Qualificado','Proposta Enviada','Convertido','Perdido'];
const LEAD_SOURCES = ['Facebook','Instagram','Google','Site','WhatsApp','Indicação','Outro'];

const SOURCE_ICONS = { Facebook:'📘', Instagram:'📸', Google:'🔍', Site:'🌐', WhatsApp:'💬', Indicação:'🤝', Outro:'📌' };

function sourceClass(s) { return { Facebook:'facebook', Instagram:'instagram', Google:'google', Site:'site', WhatsApp:'whatsapp', Indicação:'indicacao', Outro:'outro' }[s]||'outro'; }
function sourceBadge(s) { return `<span class="lead-source-badge source-${sourceClass(s)}">${SOURCE_ICONS[s]||'📌'} ${s}</span>`; }

let leadsTab = 'pipeline'; // 'pipeline' | 'lista' | 'campanhas'
let leadsFiltroFonte = '', leadsFiltroCamp = '';

function renderLeads() {
  const totalLeads = db.leads.length;
  const novos = db.leads.filter(l=>l.status==='Novo').length;
  const convertidos = db.leads.filter(l=>l.status==='Convertido').length;
  const perdidos = db.leads.filter(l=>l.status==='Perdido').length;
  const taxaConv = totalLeads>0 ? ((convertidos/totalLeads)*100).toFixed(1) : '0.0';
  const totalInvestido = db.campanhas.reduce((s,c)=>s+parseFloat(c.investimento||0),0);
  const cpl = convertidos>0 ? totalInvestido/convertidos : (totalLeads>0 ? totalInvestido/totalLeads : 0);

  let tabContent = '';
  if(leadsTab==='pipeline') tabContent = renderPipeline();
  else if(leadsTab==='lista') tabContent = renderListaLeads();
  else tabContent = renderCampanhas();

  document.getElementById('content').innerHTML = `
    <div class="cards-grid">
      <div class="card"><div class="card-label">Total Leads</div><div class="card-value">${totalLeads}</div><div class="card-sub">${novos} novos hoje</div></div>
      <div class="card yellow"><div class="card-label">Em Andamento</div><div class="card-value">${totalLeads-convertidos-perdidos}</div><div class="card-sub">no funil</div></div>
      <div class="card green"><div class="card-label">Convertidos</div><div class="card-value">${convertidos}</div><div class="card-sub">${taxaConv}% taxa</div></div>
      <div class="card red"><div class="card-label">Perdidos</div><div class="card-value">${perdidos}</div></div>
      <div class="card orange"><div class="card-label">Investido</div><div class="card-value" style="font-size:1.1rem">${fmt(totalInvestido)}</div></div>
      <div class="card purple"><div class="card-label">Custo/Lead</div><div class="card-value" style="font-size:1.1rem">${fmt(cpl)}</div><div class="card-sub">por lead</div></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="leads-view-toggle">
          <button class="view-btn ${leadsTab==='pipeline'?'active':''}" onclick="leadsTab='pipeline';renderLeads()">📊 Pipeline</button>
          <button class="view-btn ${leadsTab==='lista'?'active':''}" onclick="leadsTab='lista';renderLeads()">📋 Lista</button>
          <button class="view-btn ${leadsTab==='campanhas'?'active':''}" onclick="leadsTab='campanhas';renderLeads()">📣 Campanhas</button>
        </div>
        <div class="flex-gap">
          <button class="btn btn-sm btn-gray" onclick="importarLeads()">⬆️ Importar Leads</button>
          <input type="file" id="leads-file" accept=".json" style="display:none" onchange="carregarLeadsArquivo(event)">
          <button class="btn btn-primary btn-sm" onclick="abrirModalLead()">+ Novo Lead</button>
        </div>
      </div>
      ${tabContent}
    </div>`;
}

function renderPipeline() {
  const filtrados = db.leads.filter(l =>
    (!leadsFiltroFonte || l.fonte===leadsFiltroFonte) &&
    (!leadsFiltroCamp || l.campanhaId==leadsFiltroCamp)
  );
  const ativas = LEAD_STAGES.filter(s=>s!=='Perdido');
  return `
    <div class="search-bar" style="margin-bottom:14px">
      <select onchange="leadsFiltroFonte=this.value;renderLeads()">
        <option value="">Todas as fontes</option>
        ${LEAD_SOURCES.map(s=>`<option value="${s}" ${leadsFiltroFonte===s?'selected':''}>${SOURCE_ICONS[s]} ${s}</option>`).join('')}
      </select>
      <select onchange="leadsFiltroCamp=this.value;renderLeads()">
        <option value="">Todas as campanhas</option>
        ${db.campanhas.map(c=>`<option value="${c.id}" ${leadsFiltroCamp==c.id?'selected':''}>${c.nome}</option>`).join('')}
      </select>
    </div>
    <div class="pipeline-wrap">
      ${ativas.map(stage => {
        const leads = filtrados.filter(l=>l.status===stage);
        return `<div class="pipeline-col">
          <div class="pipeline-col-header">${stage} <span class="count">${leads.length}</span></div>
          ${leads.length===0?`<div style="text-align:center;padding:16px;color:var(--gray3);font-size:.8rem">Sem leads</div>`:
            leads.map(l=>`<div class="lead-card ${sourceClass(l.fonte)}" onclick="abrirModalLead(${l.id})">
              <div class="lead-card-name">${l.nome}</div>
              <div class="lead-card-info">${l.telefone||''}</div>
              <div class="lead-card-info">${l.servico?'🏗️ '+servicoLabel(l.servico):''}</div>
              ${sourceBadge(l.fonte)}
              ${l.campanhaId?`<div class="lead-card-info" style="margin-top:4px">📣 ${db.campanhas.find(c=>c.id==l.campanhaId)?.nome||''}</div>`:''}
            </div>`).join('')}
        </div>`;
      }).join('')}
      <div class="pipeline-col" style="border: 1.5px dashed var(--gray3);">
        <div class="pipeline-col-header" style="color:var(--danger)">Perdido <span class="count">${filtrados.filter(l=>l.status==='Perdido').length}</span></div>
        ${filtrados.filter(l=>l.status==='Perdido').map(l=>`<div class="lead-card ${sourceClass(l.fonte)}" style="opacity:.6" onclick="abrirModalLead(${l.id})">
          <div class="lead-card-name">${l.nome}</div>
          <div class="lead-card-info">${l.motivoPerda||'Sem motivo'}</div>
          ${sourceBadge(l.fonte)}
        </div>`).join('')}
      </div>
    </div>`;
}

        lista.map(l=>`<tr>

          <td>${sourceBadge(l.fonte)}</td>

          <td>${fmtDate(l.dataEntrada)}</td>
          <td>${statusBadge(l.status)}</td>
          <td><div class="flex-gap">
            <button class="btn btn-sm btn-outline" onclick="abrirModalLead(${l.id})">✏️</button>
            ${l.status==='Qualificado'||l.status==='Proposta Enviada'?`<button class="btn btn-sm btn-success" onclick="converterLeadEmCliente(${l.id})">👤 Converter</button>`:''}
            <button class="btn btn-sm btn-danger" onclick="deletarLead(${l.id})">🗑️</button>
          </div></td>
        </tr>`).join('')}
      </tbody>

function renderCampanhas() {
  return `
    <div class="panel-header" style="margin-bottom:0"><h2 style="font-size:.9rem">📣 Campanhas de Tráfego Pago</h2><button class="btn btn-sm btn-primary" onclick="abrirModalCampanha()">+ Nova Campanha</button></div>
    <div class="table-wrap" style="margin-top:14px"><table>
      <thead><tr><th>Campanha</th><th>Canal</th><th>Período</th><th>Investimento</th><th>Leads</th><th>Convertidos</th><th>CPL</th><th>ROI</th><th>Ações</th></tr></thead>
      <tbody>${db.campanhas.length===0?'<tr class="empty-row"><td colspan="9">Nenhuma campanha cadastrada</td></tr>':
        db.campanhas.map(c=>{
          const leadsC = db.leads.filter(l=>l.campanhaId==c.id);
          const convertC = leadsC.filter(l=>l.status==='Convertido').length;
          const inv = parseFloat(c.investimento||0);
          const cpl = leadsC.length>0 ? inv/leadsC.length : 0;
          // ROI: receita dos leads convertidos vs investimento
          const recLeads = db.invoices.filter(i=>leadsC.some(l=>l.clienteId==i.clienteId)&&i.status==='Pago').reduce((s,i)=>s+parseFloat(i.total||0),0);
          const roi = inv>0 ? (((recLeads-inv)/inv)*100).toFixed(0) : '-';
          return `<tr>
            <td><strong>${c.nome}</strong>${c.objetivo?`<br><span class="text-muted">${c.objetivo}</span>`:''}</td>
            <td>${sourceBadge(c.canal)}</td>
            <td>${fmtDate(c.dataInicio)}${c.dataFim?' → '+fmtDate(c.dataFim):''}</td>
            <td><strong>${fmt(inv)}</strong></td>
            <td>${leadsC.length}</td>
            <td>${convertC}</td>
            <td>${fmt(cpl)}</td>
            <td style="color:${roi>0?'var(--success)':roi==='0'?'var(--gray4)':'var(--danger)'};font-weight:700">${roi!=='-'?roi+'%':'-'}</td>

          </tr>`;}).join('')}

}

function salvarLead(id) {
  const nome = document.getElementById('f-nome').value.trim(); if(!nome){alert('Nome obrigatório!');return;}
  const obj = {
    nome, telefone:document.getElementById('f-tel').value, email:document.getElementById('f-email').value,
    endereco:document.getElementById('f-end').value, fonte:document.getElementById('f-fonte').value,
    campanhaId:parseInt(document.getElementById('f-camp').value)||null,
    servico:document.getElementById('f-servico').value, status:document.getElementById('f-status').value,
    dataEntrada:document.getElementById('f-data').value, responsavel:document.getElementById('f-resp').value,
    orcamentoEstimado:parseFloat(document.getElementById('f-orc').value)||null,
    motivoPerda:document.getElementById('f-perda').value, notas:document.getElementById('f-notas').value
  };
  if(id){const i=db.leads.findIndex(x=>x.id==id);if(i>=0)db.leads[i]={...db.leads[i],...obj};}
  else{obj.id=nextId('leads');db.leads.push(obj);}
  salvar();fecharModal();renderLeads();toast(id?'Lead atualizado!':'Lead cadastrado!','success');
}

function deletarLead(id){if(!confirm('Deletar lead?'))return;db.leads=db.leads.filter(x=>x.id!=id);salvar();renderLeads();}

function converterLeadEmCliente(leadId) {
  const l = db.leads.find(x=>x.id==leadId); if(!l)return;
  // Cria cliente
  const cli = {id:nextId('clientes'),nome:l.nome,telefone:l.telefone,email:l.email,endereco:l.endereco,obs:`Lead convertido em ${today()}. Fonte: ${l.fonte}. ${l.notas||''}`};
  db.clientes.push(cli);
  // Cria orçamento rascunho
  const orc = {id:nextId('orcamentos'),clienteId:cli.id,servico:l.servico||'outro',data:today(),validade:addDays(today(),30),status:'Pendente',desconto:0,descricao:`Convertido do lead #${l.id} – ${l.fonte}`,itens:[{tipo:l.servico||'outro',desc:'A definir',qty:1,preco:l.orcamentoEstimado||0}]};
  db.orcamentos.push(orc);
  // Atualiza lead
  const li = db.leads.findIndex(x=>x.id==leadId);
  db.leads[li].status='Convertido';
  db.leads[li].clienteId=cli.id;
  salvar();fecharModal();
  showPage('orcamentos');
  toast(`✅ Lead convertido! Cliente e orçamento criados.`,'success');
}

function importarLeads(){document.getElementById('leads-file').click();}
function carregarLeadsArquivo(event){
  const f=event.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{
    const dados=JSON.parse(e.target.result);
    if(!Array.isArray(dados)){alert('Formato inválido – esperado array de leads.');return;}
    let count=0;
    dados.forEach(l=>{
      if(l.nome){
        l.id=nextId('leads');l.status=l.status||'Novo';l.dataEntrada=l.dataEntrada||today();l.fonte=l.fonte||'Outro';
        db.leads.push(l);count++;
      }
    });
    salvar();renderLeads();toast(`${count} lead(s) importado(s)!`,'success');
  }catch{alert('Erro ao ler arquivo.');}};
  r.readAsText(f);event.target.value='';
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const hb = document.getElementById('hamburger-btn');
  const isOpen = sb.classList.contains('open');
  if(isOpen) { closeSidebar(); } else {
    sb.classList.add('open');
    ov.classList.add('show');
    hb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
  const hb = document.getElementById('hamburger-btn');
  if(hb) hb.classList.remove('open');
  document.body.style.overflow = '';
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button in sidebar footer after a moment
  setTimeout(() => {
    const ver = document.querySelector('#sidebar .version');
    if(ver && !document.getElementById('install-btn')) {
      const btn = document.createElement('button');
      btn.id = 'install-btn';
      btn.textContent = '📲 Instalar App';
      btn.style.cssText = 'display:block;width:calc(100% - 40px);margin:0 20px 12px;padding:8px;background:#0066ff;color:#fff;border:none;border-radius:7px;font-size:.82rem;font-weight:700;cursor:pointer;letter-spacing:.3px';
      btn.onclick = () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { btn.remove(); deferredPrompt=null; });
      };
      ver.parentNode.insertBefore(btn, ver);
    }
  }, 3000);
