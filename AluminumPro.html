<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlumiCraft – Gestão de Empresa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0066ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlumiCraft">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0066ff; --primary-dark: #0051cc; --primary-light: rgba(0,102,255,0.15);
    --cyan: #00b4ff; --accent: #00b4ff;
    --danger: #ff4040; --success: #00d97e; --warning: #ffc107;
    --text: #c8d8ee; --text-muted: #4d6a87; --text-dim: #2d4a65;
    --bg: #070c18; --bg-card: #0b1525; --bg-input: #081220;
    --bg-elevated: #0d1a2c; --border: #162030; --border-bright: #1d2f48;
    /* legacy aliases (kept for compat) */
    --gray1: #0d1826; --gray2: #162030; --gray3: #2d4a65;
    --gray4: #4d6a87; --gray5: #c8d8ee;
    --sidebar-w: 220px; --radius: 10px; --shadow: 0 4px 28px rgba(0,0,0,0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
  body { display: flex; min-height: 100vh; background: var(--bg); color: var(--text); }

  /* SIDEBAR */
  #sidebar { width: var(--sidebar-w); background: #0a0f1e; color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
  #sidebar .logo { padding: 14px 12px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
  #sidebar .logo img { width: 180px; height: auto; object-fit: contain; filter: drop-shadow(0 0 8px rgba(0,120,255,0.4)); }
  #sidebar .logo span { font-size: 1.5rem; }
  #sidebar nav { flex: 1; padding: 10px 0; overflow-y: auto; }
  #sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: rgba(180,210,255,0.7); text-decoration: none; font-size: 0.88rem; border-left: 3px solid transparent; transition: all 0.18s; cursor: pointer; letter-spacing: 0.2px; }
  #sidebar nav a:hover { background: rgba(0,180,255,0.07); color: #e0f0ff; }
  #sidebar nav a.active { background: rgba(0,180,255,0.12); color: #00b4ff; border-left-color: #00b4ff; font-weight: 600; }
  #sidebar nav a .icon { font-size: 1.05rem; width: 22px; text-align: center; }
  #sidebar .version { padding: 12px 20px; font-size: 0.74rem; color: rgba(255,255,255,0.3); border-top: 1px solid rgba(255,255,255,0.1); }

  /* MAIN */
  #main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  #topbar { background: #0b1525; border-bottom: 1px solid #162030; padding: 0 28px; height: 58px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 16px rgba(0,0,0,0.5); }
  #topbar h1 { font-size: 1.05rem; font-weight: 700; color: #e0ecff; letter-spacing: 0.2px; }
  #topbar .topbar-right { display: flex; align-items: center; gap: 10px; }
  #topbar .badge-empresa { background: rgba(0,102,255,0.2); color: #00b4ff; padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; }
  #content { flex: 1; padding: 24px 28px; background: var(--bg); }

  /* CARDS */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--bg-card); border-radius: var(--radius); padding: 18px 16px; box-shadow: var(--shadow); border-top: 3px solid var(--primary); border: 1px solid var(--border); border-top: 3px solid var(--primary); }
  .card.green { border-top-color: var(--success); } .card.orange { border-top-color: var(--warning); }
  .card.yellow { border-top-color: #fbbf24; } .card.red { border-top-color: var(--danger); }
  .card.purple { border-top-color: #a855f7; }
  .card .card-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; font-weight: 600; }
  .card .card-value { font-size: 1.7rem; font-weight: 700; color: var(--text); line-height: 1; }
  .card .card-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 5px; }

  /* PANEL */
  .panel { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 20px; border: 1px solid var(--border); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .panel-header h2 { font-size: 0.98rem; font-weight: 700; color: var(--text); }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 7px; border: none; cursor: pointer; font-size: 0.86rem; font-weight: 600; transition: all 0.15s; letter-spacing: 0.2px; }
  .btn-primary { background: #0066ff; color: #fff; } .btn-primary:hover { background: #0051cc; box-shadow: 0 0 0 3px rgba(0,102,255,0.3); }
  .btn-success { background: #00d97e; color: #fff; } .btn-danger { background: #ff4040; color: #fff; }
  .btn-outline { background: transparent; color: #60a5fa; border: 1.5px solid #1d3a60; } .btn-outline:hover { background: rgba(0,102,255,0.12); border-color: #0066ff; color: #fff; }
  .btn-sm { padding: 4px 9px; font-size: 0.78rem; } .btn-accent { background: #00b4ff; color: #fff; }
  .btn-gray { background: #162030; color: var(--text); border: 1px solid var(--border); } .btn-gray:hover { background: #1d2f48; }
  .btn-purple { background: #7c3aed; color: #fff; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  th { background: #081220; color: #4d6a87; font-weight: 700; padding: 9px 11px; text-align: left; border-bottom: 2px solid #162030; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 9px 11px; border-bottom: 1px solid #0f1e30; vertical-align: middle; color: var(--text); }
  tr:last-child td { border-bottom: none; } tr:hover td { background: rgba(0,102,255,0.05); }
  .empty-row td { text-align: center; color: var(--text-dim); padding: 28px; font-style: italic; }

  /* BADGES */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.73rem; font-weight: 600; }
  .badge-pendente { background: rgba(255,160,0,0.15); color: #ffc107; border:1px solid rgba(255,160,0,0.3); } .badge-aprovado { background: rgba(0,217,126,0.15); color: #00d97e; border:1px solid rgba(0,217,126,0.3); }
  .badge-recusado { background: rgba(255,64,64,0.15); color: #ff6060; border:1px solid rgba(255,64,64,0.3); } .badge-agendado { background: rgba(0,102,255,0.15); color: #60a5fa; border:1px solid rgba(0,102,255,0.3); }
  .badge-andamento { background: rgba(251,191,36,0.15); color: #fbbf24; border:1px solid rgba(251,191,36,0.3); } .badge-concluido { background: rgba(0,217,126,0.15); color: #00d97e; border:1px solid rgba(0,217,126,0.3); }
  .badge-cancelado { background: rgba(168,85,247,0.15); color: #c084fc; border:1px solid rgba(168,85,247,0.3); } .badge-pago { background: rgba(0,217,126,0.15); color: #00d97e; border:1px solid rgba(0,217,126,0.3); }
  .badge-aberto { background: rgba(255,160,0,0.15); color: #ffc107; border:1px solid rgba(255,160,0,0.3); } .badge-vencido { background: rgba(255,64,64,0.15); color: #ff6060; border:1px solid rgba(255,64,64,0.3); }
  .badge-ok { background: rgba(0,217,126,0.15); color: #00d97e; border:1px solid rgba(0,217,126,0.3); } .badge-baixo { background: rgba(255,64,64,0.15); color: #ff6060; border:1px solid rgba(255,64,64,0.3); }
  .badge-receita { background: rgba(0,217,126,0.15); color: #00d97e; border:1px solid rgba(0,217,126,0.3); } .badge-despesa { background: rgba(255,64,64,0.15); color: #ff6060; border:1px solid rgba(255,64,64,0.3); }
  .badge-rascunho { background: rgba(77,106,135,0.2); color: #7a9ab5; border:1px solid rgba(77,106,135,0.3); } .badge-enviado { background: rgba(0,180,255,0.15); color: #00b4ff; border:1px solid rgba(0,180,255,0.3); }

  /* SEARCH */
  .search-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .search-bar input, .search-bar select { padding: 7px 11px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 0.86rem; outline: none; background: var(--bg-input); color: var(--text); }
  .search-bar input:focus, .search-bar select:focus { border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0,102,255,0.15); }
  .search-bar input { flex: 1; min-width: 180px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
  .modal { background: var(--bg-card); border-radius: 14px; width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; box-shadow: 0 12px 60px rgba(0,0,0,0.7); border: 1px solid var(--border-bright); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-card); z-index: 2; }
  .modal-header h3 { font-size: 1rem; font-weight: 700; color: var(--text); }
  .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); line-height: 1; padding: 2px 6px; border-radius: 5px; }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .modal-body { padding: 18px 22px; } .modal-footer { padding: 12px 22px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }

  /* FORM */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.span2 { grid-column: span 2; }
  .form-group label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input, .form-group select, .form-group textarea { padding: 8px 11px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 0.88rem; outline: none; background: var(--bg-input); color: var(--text); transition: border 0.15s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0,102,255,0.2); }
  .form-group textarea { resize: vertical; min-height: 65px; }

  /* ITEM ROWS */
  .items-section { margin-top: 16px; }
  .items-section h4 { font-size: 0.85rem; font-weight: 700; color: var(--gray4); text-transform: uppercase; margin-bottom: 8px; }
  .item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  .item-row input, .item-row select { padding: 6px 9px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.83rem; outline: none; background: var(--bg-input); color: var(--text); }
  .item-row input:focus, .item-row select:focus { border-color: #0066ff; }
  .item-row .remove-btn { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 1.05rem; padding: 4px; border-radius: 5px; }
  .item-row .remove-btn:hover { background: #fce4ec; }
  .items-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 6px; margin-bottom: 4px; }
  .items-header span { font-size: 0.73rem; font-weight: 600; color: var(--gray4); text-transform: uppercase; padding: 0 2px; }
  .total-line { text-align: right; margin-top: 8px; font-size: 0.98rem; font-weight: 700; }

  /* FINANCEIRO */
  .fin-resumo { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 20px; }
  .fin-card { background: var(--bg-card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); text-align: center; border: 1px solid var(--border); }
  .fin-card .label { font-size: 0.77rem; color: var(--text-muted); margin-bottom: 7px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
  .fin-card .value { font-size: 1.35rem; font-weight: 700; }
  .fin-card.receita .value { color: #00d97e; } .fin-card.despesa .value { color: #ff4040; }
  .fin-card.saldo .value { color: #00b4ff; } .fin-card.alerta .value { color: #ffc107; }

  /* TABS */
  .tabs { display: flex; gap: 3px; margin-bottom: 18px; border-bottom: 2px solid var(--border); }
  .tab-btn { background: none; border: none; padding: 8px 16px; cursor: pointer; font-size: 0.88rem; color: var(--text-muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -2px; border-radius: 6px 6px 0 0; transition: all 0.15s; }
  .tab-btn.active { color: #00b4ff; border-bottom-color: #00b4ff; background: rgba(0,180,255,0.08); }
  .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.04); color: var(--text); }

  /* MISC */
  .alerta-box { background: rgba(255,160,0,0.12); border: 1px solid rgba(255,160,0,0.3); border-radius: 8px; padding: 9px 13px; margin-bottom: 12px; font-size: 0.84rem; color: #ffc107; display: flex; align-items: center; gap: 8px; }
  .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .dash-row { grid-template-columns: 1fr; } .fin-resumo { grid-template-columns: repeat(2,1fr); } }
  .recent-list { list-style: none; }
  .recent-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem; color: var(--text); }
  .recent-list li:last-child { border-bottom: none; }
  .hidden { display: none !important; }
  .flex-gap { display: flex; gap: 5px; flex-wrap: wrap; }
  .text-muted { color: var(--gray4); font-size: 0.8rem; }
  .mt10 { margin-top: 10px; }

  /* INVOICE NUMBER */
  .inv-num { font-family: 'Inter', monospace; font-weight: 700; color: #00b4ff; }

  /* LEADS PIPELINE */
  .pipeline-wrap { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .pipeline-col { min-width: 200px; flex: 1; background: var(--bg-card); border-radius: var(--radius); padding: 12px; border: 1px solid var(--border); }
  .pipeline-col-header { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .pipeline-col-header .count { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 1px 7px; font-size: 0.75rem; color: var(--text); }
  .lead-card { background: var(--bg-elevated); border-radius: 8px; padding: 11px 13px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); border-left: 3px solid var(--primary); cursor: pointer; transition: box-shadow 0.15s; border: 1px solid var(--border); }
  .lead-card:hover { box-shadow: 0 4px 20px rgba(0,102,255,0.2); border-color: rgba(0,102,255,0.3); }
  .lead-card.facebook { border-left-color: #1877f2; }
  .lead-card.instagram { border-left-color: #e1306c; }
  .lead-card.google { border-left-color: #fbbc05; }
  .lead-card.site { border-left-color: var(--success); }
  .lead-card.whatsapp { border-left-color: #25d366; }
  .lead-card.indicacao { border-left-color: #7b1fa2; }
  .lead-card-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 3px; color: var(--text); }
  .lead-card-info { font-size: 0.78rem; color: var(--text-muted); }
  .lead-source-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 0.71rem; font-weight: 600; padding: 2px 7px; border-radius: 10px; margin-top: 5px; }
  .source-facebook { background: rgba(24,119,242,0.2); color: #60a5fa; }
  .source-instagram { background: rgba(225,48,108,0.2); color: #f472b6; }
  .source-google { background: rgba(251,188,5,0.2); color: #fbbf24; }
  .source-site { background: rgba(0,217,126,0.2); color: #00d97e; }
  .source-whatsapp { background: rgba(37,211,102,0.2); color: #34d399; }
  .source-indicacao { background: rgba(168,85,247,0.2); color: #c084fc; }
  .source-outro { background: rgba(77,106,135,0.2); color: var(--text-muted); }
  .camp-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .camp-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.4s; }
  .leads-view-toggle { display: flex; gap: 4px; }
  .view-btn { background: var(--border); border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
  .view-btn.active { background: #0066ff; color: #fff; }

  /* TOAST */
  #toast { position: fixed; bottom: 24px; right: 24px; background: #0d1826; color: #e0ecff; padding: 11px 18px; border-radius: 8px; font-size: 0.88rem; z-index: 9999; box-shadow: 0 4px 24px rgba(0,0,0,0.6); transition: opacity 0.3s; border: 1px solid var(--border-bright); }
  #toast.hidden { opacity: 0; pointer-events: none; }
  #toast.success { background: rgba(0,100,50,0.9); border-color: #00d97e; } #toast.error { background: rgba(120,0,0,0.9); border-color: #ff4040; } #toast.info { background: rgba(0,40,100,0.9); border-color: #0066ff; }


  /* ===== LOGIN / AUTH ===== */
  #login-overlay{display:none;position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 30% 40%,#0d1f3c 0%,#040810 100%);justify-content:center;align-items:center;flex-direction:column}
  #login-overlay.show{display:flex}
  .login-box{background:#0b1525;border-radius:16px;padding:40px 44px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.8);animation:fadeUp .3s ease;border:1px solid #1d3050}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .login-logo{text-align:center;margin-bottom:20px}
  .login-logo img{height:60px;object-fit:contain}
  .login-brand{font-size:1.7rem;font-weight:800;color:#00b4ff;margin-top:6px}
  .login-box h2{margin:0 0 4px;font-size:1.35rem;color:#e2eaf5;font-weight:800}
  .login-sub{margin:0 0 22px;font-size:.84rem;color:#4d6a87}
  .login-field{margin-bottom:14px}
  .login-field label{display:block;font-size:.78rem;font-weight:700;color:#4d6a87;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .login-field input{width:100%;padding:10px 14px;border:1.5px solid #1a2d4a;border-radius:8px;font-size:.95rem;outline:none;transition:border .15s;box-sizing:border-box;background:#081220;color:#c8d8ee}
  .login-field input:focus{border-color:#0066ff;box-shadow:0 0 0 3px rgba(0,102,255,.2)}
  .login-btn{width:100%;padding:12px;background:#0066ff;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;transition:all .15s;letter-spacing:.3px;text-transform:uppercase}
  .login-btn:hover{background:#0051cc;box-shadow:0 0 0 3px rgba(0,102,255,.3)}
  .login-error{color:#e53e3e;font-size:.83rem;margin-top:10px;text-align:center;min-height:18px}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:.84rem;color:#8ab0cc}
  .user-avatar{width:30px;height:30px;background:#0066ff;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
  .logout-btn{background:none;border:1px solid #1a2d4a;border-radius:7px;padding:5px 11px;font-size:.8rem;color:#4d6a87;cursor:pointer;transition:all .15s}
  .logout-btn:hover{background:rgba(255,64,64,0.1);color:#ff6060;border-color:rgba(255,64,64,0.4)}
  .perm-toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-input);border-radius:8px;border:1px solid var(--border);cursor:pointer}
  .perm-toggle input[type=checkbox]{width:17px;height:17px;accent-color:#1a5fa8;cursor:pointer;flex-shrink:0}
  .perm-toggle span{font-size:.88rem;color:var(--text);font-weight:500}

  /* ===== ANEXOS / ATTACHMENTS ===== */
  .anexo-section { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
  .anexo-section h4 { font-size: .8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 10px; }
  .anexo-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; min-height: 4px; }
  .anexo-item { position: relative; }
  .anexo-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; display: block; transition: border-color .15s; }

  .anexo-add-btn:hover { border-color: #0066ff; color: #0066ff; background: rgba(0,102,255,.06); }
  .anexo-badge { display: inline-flex; align-items: center; gap: 3px; background: rgba(0,102,255,.15); color: #60aaff; border: 1px solid rgba(0,102,255,.25); border-radius: 10px; padding: 1px 7px; font-size: .7rem; font-weight: 600; }
  .anexo-pending-border { border-color: #00b4ff !important; }
  @media (max-width: 768px) {
    .anexo-thumb, .anexo-file, .anexo-add-btn { width: 68px; height: 68px; }
  }

  @media print { #sidebar, #topbar { display: none; } #main { margin-left: 0; } #content { padding: 10px; } .btn, .search-bar { display: none; } }
  select option { background: #081220; color: #c8d8ee; }
  input::placeholder { color: #2d4a65; }
  textarea::placeholder { color: #2d4a65; }
  /* ===== HAMBURGER & MOBILE DRAWER ===== */

  #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 99; backdrop-filter: blur(2px); }

  /* ===== MOBILE RESPONSIVE ===== */
  @media (max-width: 768px) {

  }
  
  @media (max-width: 400px) {

<body>

<!-- ===== SIDEBAR OVERLAY (mobile) ===== -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ===== LOGIN OVERLAY ===== -->
<div id="login-overlay" class="show">
  <div class="login-box">
    <div class="login-logo">
      <img src="logo.png" alt="AlumiCraft" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="login-brand" style="display:none">🏗️ AlumiCraft</div>
    </div>
    <h2>Bem-vindo de volta!</h2>
    <p class="login-sub">Digite suas credenciais para acessar o sistema</p>
    <div class="login-field">
      <label>Usuário</label>

    <div class="login-field">

  </div>
  <nav>
    <a class="active" onclick="showPage('dashboard')" id="nav-dashboard"><span class="icon">📊</span> Dashboard</a>
    <a onclick="showPage('clientes')" id="nav-clientes"><span class="icon">👥</span> Clientes</a>
    <a onclick="showPage('orcamentos')" id="nav-orcamentos"><span class="icon">📋</span> Orçamentos</a>
    <a onclick="showPage('ordens')" id="nav-ordens"><span class="icon">🔧</span> Ordens de Serviço</a>
    <a onclick="showPage('invoices')" id="nav-invoices"><span class="icon">🧾</span> Invoices</a>
    <a onclick="showPage('leads')" id="nav-leads"><span class="icon">🎯</span> Leads & Campanhas</a>
    <a onclick="showPage('estoque')" id="nav-estoque"><span class="icon">📦</span> Estoque</a>
    <a onclick="showPage('financeiro')" id="nav-financeiro"><span class="icon">💰</span> Financeiro</a>
    <a onclick="showPage('settings')" id="nav-settings"><span class="icon">⚙️</span> Configurações</a>
    <a onclick="showPage('usuarios')" id="nav-usuarios" style="display:none"><span class="icon">👤</span> Usuários</a>
  </nav>
  <div class="version">AlumiCraft v3.0</div>
</div>

<div id="main">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:10px">

        <span></span><span></span><span></span>

      <span id="topbar-logo-wrap"><span class="badge-empresa" id="topbar-logo-fallback" style="font-size:1.1rem;font-weight:800;letter-spacing:-0.3px">🏗️ AlumiCraft</span></span>
      <button class="btn btn-sm btn-outline" onclick="exportarDados()">⬇️ Exportar</button>
      <button class="btn btn-sm btn-accent" onclick="importarDados()">⬆️ Importar</button>

    </div>
  </div>
  <div id="content"></div>

<div id="toast" class="hidden"></div>

<script>
// ===== DB =====
let db = {
  clientes: [], orcamentos: [], ordens: [], invoices: [],
  estoque: [], financeiro: [], contasPagar: [],
  leads: [], campanhas: [],
  users: [],
  settings: {
    gateway: 'stripe_netlify',
    stripeFunction: '',
    paymentLink: '',
    financingLink: '',
    financingAPR: 18,
    companyPhone: '',
    companyEmail: '',
    companyAddress: '',
    logoBase64: ''
  },
  _id: { clientes:1, orcamentos:1, ordens:1, invoices:1, estoque:1, financeiro:1, contasPagar:1, leads:1, campanhas:1, users:1 }
};
const STORAGE_KEY = 'aluminumpro_v2';
function salvar() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
function carregar() { const d = localStorage.getItem(STORAGE_KEY); if(d) { try { const p=JSON.parse(d); db={...db,...p}; if(!db.invoices) db.invoices=[]; if(!db.contasPagar) db.contasPagar=[]; if(!db.leads) db.leads=[]; if(!db.campanhas) db.campanhas=[]; if(!db.settings) db.settings={gateway:'stripe_netlify',stripeFunction:'',paymentLink:'',financingLink:'',financingAPR:18,companyPhone:'',companyEmail:'',companyAddress:''}; if(!db.settings.stripeFunction) db.settings.stripeFunction=''; if(!db.settings.logoBase64 && db.settings.logoBase64 !== '') db.settings.logoBase64=''; if(!db._id.invoices) db._id.invoices=1; if(!db._id.contasPagar) db._id.contasPagar=1; if(!db._id.leads) db._id.leads=1; if(!db._id.campanhas) db._id.campanhas=1; if(!db.users) db.users=[]; if(!db._id.users) db._id.users=1; seedAdmin(); } catch(e){ seedAdmin(); } } else { seedAdmin(); } }
function nextId(col) { const id=db._id[col]++; salvar(); return id; }

// ===== NAVEGAÇÃO =====
let paginaAtual = 'dashboard';
const PAGE_TITLES = { dashboard:'Dashboard', clientes:'Clientes', orcamentos:'Orçamentos', ordens:'Ordens de Serviço', invoices:'Invoices', leads:'Leads & Campanhas', estoque:'Estoque de Materiais', financeiro:'Financeiro', settings:'Configurações', usuarios:'Gerenciar Usuários' };
const PAGE_RENDERS = { dashboard:renderDashboard, clientes:renderClientes, orcamentos:renderOrcamentos, ordens:renderOrdens, invoices:renderInvoices, leads:renderLeads, estoque:renderEstoque, financeiro:renderFinanceiro, settings:renderSettings, usuarios:renderUsuarios };

function showPage(page) {
  if(!canAccess(page)){ toast('⛔ Acesso não autorizado!','error'); return; }
  paginaAtual = page;
  document.querySelectorAll('#sidebar nav a').forEach(a=>a.classList.remove('active'));
  const navEl=document.getElementById('nav-'+page);
  if(navEl) navEl.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[page];
  PAGE_RENDERS[page]();
}

// ===== AUTH =====
const SESSION_KEY = 'aluminumpro_session';

function hashPass(p) {
  let h = 2166136261 >>> 0;
  for(let i=0;i<p.length;i++){ h ^= p.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}

function seedAdmin() {
  if(!db.users) db.users = [];
  if(!db._id) db._id = {};
  if(!db._id.users) db._id.users = 1;
  if(db.users.length === 0) {
    db.users.push({
      id:1, nome:'Administrador', username:'admin',
      password: hashPass('admin123'), isAdmin:true,
      perms:{clientes:true,orcamentos:true,financeiro:true,estoque:true,leads:true}
    });
    db._id.users = 2;
    salvar();
  }
}

function getSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch(e) { return null; }
}

function checkAuth() {
  const sess = getSession();
  if(!sess) { showLoginScreen(); return; }
  const user = db.users.find(u=>u.id===sess.id && u.username===sess.username);
  if(!user) { showLoginScreen(); return; }
  applyPermissions(user);
  showApp(user);
  renderDashboard();
}

function showLoginScreen() {
  document.getElementById('login-overlay').classList.add('show');
  document.getElementById('user-chip').style.display='none';
  document.getElementById('logout-btn').style.display='none';
  setTimeout(()=>{ const el=document.getElementById('login-user'); if(el) el.focus(); },100);
}

function showApp(user) {
  document.getElementById('login-overlay').classList.remove('show');
  document.getElementById('login-error').textContent='';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('user-chip').style.display='flex';
  document.getElementById('logout-btn').style.display='inline-block';
  const initials = user.nome.trim().split(/\s+/).map(w=>w[0]||'').join('').substring(0,2).toUpperCase();
  document.getElementById('user-avatar').textContent = initials||'?';
  document.getElementById('user-name').textContent = user.nome;
}

function doLogin() {
  const username = (document.getElementById('login-user').value||'').trim();
  const password = document.getElementById('login-pass').value||'';
  const errEl = document.getElementById('login-error');
  if(!username||!password){ errEl.textContent='Preencha usuário e senha.'; return; }
  const user = db.users.find(u=>u.username===username && u.password===hashPass(password));
  if(!user){ errEl.textContent='Usuário ou senha incorretos.'; document.getElementById('login-pass').value=''; return; }
  errEl.textContent='';
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({id:user.id,username:user.username}));
  applyPermissions(user);
  showApp(user);
  // Navigate to first allowed page
  renderDashboard();
  paginaAtual='dashboard';
  document.querySelectorAll('#sidebar nav a').forEach(a=>a.classList.remove('active'));
  const nd=document.getElementById('nav-dashboard');
  if(nd) nd.classList.add('active');
  document.getElementById('page-title').textContent='Dashboard';
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  showLoginScreen();
  document.querySelectorAll('#sidebar nav a').forEach(a=>a.classList.remove('active'));
  const nd=document.getElementById('nav-dashboard');
  if(nd) nd.classList.add('active');
}

function currentUser() {
  const sess = getSession();
  if(!sess) return null;
  return db.users.find(u=>u.id===sess.id) || null;
}

function canAccess(page) {
  const user = currentUser();
  if(!user) return false;
  if(user.isAdmin) return true;
  const p = user.perms || {};
  const map = {
    dashboard:true, clientes:p.clientes, orcamentos:p.orcamentos,
    ordens:p.orcamentos, invoices:p.orcamentos,
    financeiro:p.financeiro, estoque:p.estoque, leads:p.leads,
    settings:false, usuarios:false
  };
  return !!map[page];
}

function applyPermissions(user) {
  const A = !!user.isAdmin;
  const p = user.perms || {};
  const vis = (id,v)=>{ const el=document.getElementById(id); if(el) el.style.display=v?'':'none'; };
  vis('nav-dashboard', true);
  vis('nav-clientes',   A||p.clientes);
  vis('nav-orcamentos', A||p.orcamentos);
  vis('nav-ordens',     A||p.orcamentos);
  vis('nav-invoices',   A||p.orcamentos);
  vis('nav-leads',      A||p.leads);
  vis('nav-estoque',    A||p.estoque);
  vis('nav-financeiro', A||p.financeiro);
  vis('nav-settings',   A);
  vis('nav-usuarios',   A);
}

// ===== USUÁRIOS (admin) =====
function renderUsuarios() {
  const me = currentUser();
  if(!me?.isAdmin){ toast('⛔ Acesso restrito ao administrador!','error'); return; }
  const lista = db.users;
  document.getElementById('content').innerHTML = `
    <div class="panel" style="max-width:860px">
      <div class="panel-header">
        <h2>👤 Gerenciar Usuários</h2>
        <button class="btn btn-primary" onclick="abrirModalUsuario(0)">+ Novo Usuário</button>
      </div>
      <table class="table">
        <thead><tr>
          <th>Nome</th><th>Usuário</th><th>Perfil</th>
          <th style="text-align:center">Clientes</th>
          <th style="text-align:center">Orç/OS/Inv</th>
          <th style="text-align:center">Financeiro</th>
          <th style="text-align:center">Estoque</th>
          <th style="text-align:center">Leads</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${lista.map(u=>{
            const chk = (k)=>u.isAdmin?'<span style="color:#48bb78;font-size:1.1rem">✓</span>':(u.perms?.[k]?'<span style="color:#48bb78;font-size:1.1rem">✓</span>':'<span style="color:#cbd5e0">—</span>');
            return `<tr>
              <td><strong>${u.nome}</strong></td>
              <td><code style="background:var(--bg);padding:2px 7px;border-radius:4px;font-size:.82rem">${u.username}</code></td>
              <td>${u.isAdmin?'<span class="badge" style="background:#1a5fa8;color:#fff;padding:3px 9px;border-radius:20px;font-size:.78rem">👑 Admin</span>':'<span class="badge" style="background:#e2e8f0;color:#4a5568;padding:3px 9px;border-radius:20px;font-size:.78rem">👤 Funcionário</span>'}</td>
              <td style="text-align:center">${chk('clientes')}</td>
              <td style="text-align:center">${chk('orcamentos')}</td>
              <td style="text-align:center">${chk('financeiro')}</td>
              <td style="text-align:center">${chk('estoque')}</td>
              <td style="text-align:center">${chk('leads')}</td>
              <td><div style="display:flex;gap:6px;justify-content:flex-end">
                <button class="btn btn-sm btn-outline" onclick="abrirModalUsuario(${u.id})">✏️ Editar</button>
                ${u.isAdmin?'':'<button class="btn btn-sm" style="background:#fff0f0;color:#e53e3e;border:1px solid #feb2b2" onclick="excluirUsuario('+u.id+')">🗑️</button>'}
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div style="margin-top:16px;padding:14px;background:#fffbeb;border-radius:8px;border:1px solid #fcd34d;font-size:.82rem;color:#92400e">
        💡 <strong>Login padrão inicial:</strong> usuário <code>admin</code> / senha <code>admin123</code> — troque a senha clicando em ✏️ Editar.
      </div>
    </div>

    <div id="modal-usuario" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;justify-content:center;align-items:flex-start;padding-top:60px">
      <div style="background:#fff;border-radius:14px;padding:32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto">
        <h3 id="modal-user-title" style="margin:0 0 20px;font-size:1.1rem;color:var(--text)">Novo Usuário</h3>
        <input type="hidden" id="modal-uid">
        <div class="form-grid">
          <div class="form-group span2"><label>Nome completo</label><input id="u-nome" placeholder="Ex: João Silva"></div>
          <div class="form-group"><label>Usuário (login)</label><input id="u-username" placeholder="joao.silva"></div>
          <div class="form-group"><label>Senha <span id="u-pass-hint" style="font-size:.75rem;color:var(--text-muted);font-weight:400">(obrigatória)</span></label><input type="password" id="u-senha" placeholder="Nova senha..."></div>
        </div>
        <div id="u-perms-area" style="margin:16px 0">
          <div style="font-size:.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">🔑 Acesso por Módulo</div>
          <div style="display:flex;flex-direction:column;gap:8px">

            <label class="perm-toggle"><input type="checkbox" id="p-orcamentos"><span>📋 Orçamentos, OS e Invoices</span></label>

function abrirModalUsuario(uid) {
  const modal = document.getElementById('modal-usuario');
  modal.style.display = 'flex';
  const u = uid ? db.users.find(x=>x.id===uid) : null;
  document.getElementById('modal-user-title').textContent = u ? '✏️ Editar Usuário' : '👤 Novo Usuário';
  document.getElementById('modal-uid').value = uid||'';
  document.getElementById('u-nome').value = u?.nome||'';
  document.getElementById('u-username').value = u?.username||'';
  document.getElementById('u-senha').value = '';
  document.getElementById('u-pass-hint').textContent = u ? '(deixe em branco para não alterar)' : '(obrigatória)';
  const p = u?.perms||{};
  ['clientes','orcamentos','financeiro','estoque','leads'].forEach(k=>{
    const el=document.getElementById('p-'+k);
    if(el) el.checked = u?.isAdmin ? true : (!!p[k]);
  });
  document.getElementById('u-perms-area').style.display = u?.isAdmin ? 'none' : 'block';
  document.getElementById('u-admin-area').style.display = u?.isAdmin ? 'block' : 'none';
}

function fecharModalUsuario() {
  const m=document.getElementById('modal-usuario');
  if(m) m.style.display='none';
}

function salvarUsuario() {
  const uid = parseInt(document.getElementById('modal-uid').value)||0;
  const nome = (document.getElementById('u-nome').value||'').trim();
  const username = (document.getElementById('u-username').value||'').trim().toLowerCase().replace(/\s+/g,'.');
  const senha = document.getElementById('u-senha').value||'';
  if(!nome||!username){ toast('Preencha nome e usuário.','error'); return; }
  if(!/^[a-z0-9._]+$/.test(username)){ toast('Usuário: use apenas letras, números, ponto ou underscore.','error'); return; }
  const dup = db.users.find(u=>u.username===username && u.id!==uid);
  if(dup){ toast('Este nome de usuário já existe.','error'); return; }
  if(uid){
    const idx=db.users.findIndex(u=>u.id===uid);
    if(idx<0) return;
    db.users[idx].nome=nome;
    db.users[idx].username=username;
    if(senha) db.users[idx].password=hashPass(senha);
    if(!db.users[idx].isAdmin){
      db.users[idx].perms={
        clientes:document.getElementById('p-clientes').checked,
        orcamentos:document.getElementById('p-orcamentos').checked,
        financeiro:document.getElementById('p-financeiro').checked,
        estoque:document.getElementById('p-estoque').checked,
        leads:document.getElementById('p-leads').checked
      };
    }
    toast('Usuário atualizado!','success');
  } else {
    if(!senha){ toast('Informe uma senha.','error'); return; }
    if(senha.length<4){ toast('Senha deve ter ao menos 4 caracteres.','error'); return; }
    db.users.push({
      id:db._id.users++, nome, username,
      password:hashPass(senha), isAdmin:false,
      perms:{
        clientes:document.getElementById('p-clientes').checked,
        orcamentos:document.getElementById('p-orcamentos').checked,
        financeiro:document.getElementById('p-financeiro').checked,
        estoque:document.getElementById('p-estoque').checked,
        leads:document.getElementById('p-leads').checked
      }
    });
    toast('Usuário criado com sucesso!','success');
  }
  salvar();
  fecharModalUsuario();
  renderUsuarios();
}

function excluirUsuario(uid) {
  const u=db.users.find(x=>x.id===uid);
  if(!u||u.isAdmin) return;
  if(!confirm('Excluir o usuário "'+u.nome+'"?')) return;
  db.users=db.users.filter(x=>x.id!==uid);
  salvar();
  renderUsuarios();
  toast('Usuário removido.','success');
}

// ===== TOAST =====
function toast(msg, type='') { const el=document.getElementById('toast'); el.textContent=msg; el.className=type; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),2800); }

// ===== UTILS =====
function fmt(v) { return '$ '+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d) { if(!d) return '-'; const [y,m,di]=d.split('-'); return `${m}/${di}/${y}`; }
function today() { return new Date().toISOString().split('T')[0]; }
function addDays(d,n) { const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().split('T')[0]; }
function clienteNome(id) { const c=db.clientes.find(x=>x.id==id); return c?c.nome:'-'; }
function clienteObj(id) { return db.clientes.find(x=>x.id==id)||{}; }
function orcTotal(orc) { return (orc.itens||[]).reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.preco)||0),0); }
function servicoLabel(s) { return {gutter:'Gutter',soffit:'Soffit',pool_cage:'Pool Cage',carport:'Carport',railing:'Railing',outro:'Other'}[s]||s; }
function invNumero(inv) { return 'INV-'+String(inv.id).padStart(4,'0'); }
function isVencido(dataVenc) { return dataVenc && dataVenc < today(); }

function statusBadge(st) {
  const cls = { 'Pendente':'badge-pendente','Aprovado':'badge-aprovado','Recusado':'badge-recusado','Agendado':'badge-agendado','Em Andamento':'badge-andamento','Concluído':'badge-concluido','Cancelado':'badge-cancelado','Pago':'badge-pago','Aberto':'badge-aberto','Vencido':'badge-vencido','Receita':'badge-receita','Despesa':'badge-despesa','OK':'badge-ok','Baixo':'badge-baixo','Rascunho':'badge-rascunho','Enviado':'badge-enviado' };
  return `<span class="badge ${cls[st]||''}">${st}</span>`;
}

function invStatusAtual(inv) {
  if(inv.status==='Pago') return 'Pago';
  if(inv.status==='Cancelado') return 'Cancelado';
  if(inv.dataVenc && inv.dataVenc < today() && inv.status!=='Pago') return 'Vencido';
  return inv.status||'Rascunho';
}

// ===== DASHBOARD =====
function renderDashboard() {
  const mes = today().substring(0,7);
  const invAbertas = db.invoices.filter(i=>['Rascunho','Enviado'].includes(i.status)).length;
  const invVencidas = db.invoices.filter(i=>invStatusAtual(i)==='Vencido').length;
  const totalReceber = db.invoices.filter(i=>!['Pago','Cancelado'].includes(i.status)).reduce((s,i)=>s+parseFloat(i.total||0),0);
  const totalPagar = db.contasPagar.filter(c=>c.status!=='Pago').reduce((s,c)=>s+parseFloat(c.valor||0),0);
  const recMes = db.financeiro.filter(f=>f.tipo==='Receita'&&(f.data||'').startsWith(mes)).reduce((s,f)=>s+parseFloat(f.valor||0),0);
  const despMes = db.financeiro.filter(f=>f.tipo==='Despesa'&&(f.data||'').startsWith(mes)).reduce((s,f)=>s+parseFloat(f.valor||0),0);
  const recentes_inv = [...db.invoices].sort((a,b)=>b.id-a.id).slice(0,5);

  document.getElementById('content').innerHTML = `

      <div class="card yellow"><div class="card-label">Leads Ativos</div><div class="card-value">${db.leads.length-leadsConv}</div><div class="card-sub">${leadsNovos} novos · ${taxaConv}% conv.</div></div>
      <div class="card green"><div class="card-label">A Receber</div><div class="card-value" style="font-size:1.1rem">${fmt(totalReceber)}</div><div class="card-sub">${invVencidas} vencidas</div></div>
      <div class="card red"><div class="card-label">A Pagar</div><div class="card-value" style="font-size:1.1rem">${fmt(totalPagar)}</div></div>
      <div class="card green"><div class="card-label">Receitas (Mês)</div><div class="card-value" style="font-size:1.1rem">${fmt(recMes)}</div></div>
      <div class="card orange"><div class="card-label">Ads Investido</div><div class="card-value" style="font-size:1.1rem">${fmt(totalInvestido)}</div><div class="card-sub">${db.campanhas.length} campanhas</div></div>
    </div>
    <div class="dash-row">
      <div class="panel">
        <div class="panel-header"><h2>🎯 Últimos Leads</h2><button class="btn btn-sm btn-outline" onclick="showPage('leads')">Ver todos</button></div>
        ${recentes_leads.length===0?'<p class="text-muted" style="text-align:center;padding:20px">Nenhum lead ainda</p>':`
        <ul class="recent-list">${recentes_leads.map(l=>`<li><span><strong>${l.nome}</strong><br><span class="text-muted">${l.telefone||''} · ${sourceBadge(l.fonte)}</span></span><span>${statusBadge(l.status)}</span></li>`).join('')}</ul>`}
      </div>

        <ul class="recent-list">${recentes_inv.map(i=>`<li><span><strong class="inv-num">${invNumero(i)}</strong> – ${clienteNome(i.clienteId)}<br><span class="text-muted">${fmtDate(i.dataEmissao)} · ${fmt(i.total)}</span></span><span>${statusBadge(invStatusAtual(i))}</span></li>`).join('')}</ul>`}

function itemRowHtml(it,i) {
  const sub=(parseFloat(it.qty)||0)*(parseFloat(it.preco)||0);
  return `<div class="item-row" id="item-row-${i}">
    <div style="display:grid;grid-template-columns:auto 1fr;gap:4px">
      <select class="item-tipo" onchange="calcTotal()">${['gutter','soffit','pool_cage','carport','railing','outro'].map(v=>`<option value="${v}" ${it.tipo===v?'selected':''}>${servicoLabel(v)}</option>`).join('')}</select>
      <input placeholder="Descrição" value="${it.desc||''}" class="item-desc" oninput="calcTotal()">
    </div>
    <input type="number" placeholder="Qtd" value="${it.qty||1}" min="0" step="0.01" class="item-qty" oninput="calcTotal()">
    <input type="number" placeholder="$" value="${it.preco||0}" min="0" step="0.01" class="item-preco" oninput="calcTotal()">

function gerarInvoiceDeOS(osId) {
  const o=db.ordens.find(x=>x.id==osId); if(!o){return;}
  const orc=o.orcamentoId?db.orcamentos.find(x=>x.id==o.orcamentoId):null;
  const itens=orc?.itens||[{tipo:o.servico||'outro',desc:servicoLabel(o.servico),qty:1,preco:0}];
  const subtotal=orcTotal(orc||{itens});
  const desc=parseFloat(orc?.desconto||0);
  const total=subtotal-desc;
  const inv={
    id:nextId('invoices'), clienteId:o.clienteId, osId:o.id,
    orcamentoId:o.orcamentoId||null, servico:o.servico,
    dataEmissao:today(), dataVenc:addDays(today(),30),
    itens, subtotal, desconto:desc, total,
    status:'Rascunho', notas:o.obs||'', paymentTerms:'Net 30',
    tecnico:o.tecnico||''
  };
  db.invoices.push(inv);
  salvar();
  showPage('invoices');
  toast(`Invoice ${invNumero(inv)} gerada!`,'success');
}

function salvarInvoice(id) {
  const clienteId=document.getElementById('f-clienteId').value; if(!clienteId){alert('Selecione cliente!');return;}
  const itens=getItens();
  const subtotal=itens.reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.preco)||0),0);
  const desconto=parseFloat(document.getElementById('f-desconto').value||0);
  const obj={clienteId:parseInt(clienteId),servico:document.getElementById('f-servico').value,dataEmissao:document.getElementById('f-dataEmissao').value,dataVenc:document.getElementById('f-dataVenc').value,status:document.getElementById('f-status').value,paymentTerms:document.getElementById('f-terms').value,tecnico:document.getElementById('f-tec').value,notas:document.getElementById('f-notas').value,itens,subtotal,desconto,total:subtotal-desconto};
  let invFinalId=id;
  if(id){const i=db.invoices.findIndex(x=>x.id==id);if(i>=0)db.invoices[i]={...db.invoices[i],...obj};}else{obj.id=nextId('invoices');obj.attachments=[];db.invoices.push(obj);invFinalId=obj.id;}
  salvar();fecharModal();renderInvoices();toast(id?'Invoice atualizada!':'Invoice criada!','success');
  salvarAnexosPendentes('invoice',invFinalId).then(()=>{if(_pendingAnexos.length===0)renderInvoices();});
}

function marcarPago(id) {
  const inv=db.invoices.find(x=>x.id==id); if(!inv)return;
  inv.status='Pago'; inv.dataPagamento=today();
  // Lança receita automaticamente
  const jaLancado=db.financeiro.some(f=>f.invoiceId==id);
  if(!jaLancado){
    db.financeiro.push({id:nextId('financeiro'),tipo:'Receita',clienteId:inv.clienteId,invoiceId:id,categoria:servicoLabel(inv.servico),descricao:`${invNumero(inv)} – ${clienteNome(inv.clienteId)}`,valor:inv.total,data:today(),status:'Pago'});
  }
  salvar();renderInvoices();toast('Invoice marcada como paga! Receita lançada.','success');
}

async function processarPagamentoStripe(invId) {
  const inv = db.invoices.find(x=>x.id==invId); if(!inv) return;
  const c = db.clientes.find(x=>x.id==inv.clienteId);
  const s = db.settings;
  const btn = document.getElementById('btn-stripe-pay');
  if(btn){ btn.disabled=true; btn.textContent='⏳ Criando sessão...'; }

  // URL da função — relativa quando hospedado no Netlify, absoluta quando local
  const isNetlify = window.location.hostname.includes('netlify.app') || window.location.hostname.includes('alumicraft');
  const STRIPE_FUNCTION_URL = isNetlify
    ? '/.netlify/functions/create-checkout'
    : (s.stripeFunction || 'https://alumicraft-stripe.netlify.app/.netlify/functions/create-checkout');

  try {
    const resp = await fetch(STRIPE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount:      inv.total,
        invoiceId:   inv.id,
        invoiceNum:  invNumero(inv),
        clientName:  c?.nome || '',
        clientEmail: c?.email || '',
        servico:     servicoLabel(inv.servico),
        successUrl:  window.location.origin + window.location.pathname + '?paid=' + inv.id,
        cancelUrl:   window.location.origin + window.location.pathname
      })
    });

    const data = await resp.json();
    if(data.error) throw new Error(data.error);

    const idx = db.invoices.findIndex(x=>x.id==invId);
    if(idx>=0){ db.invoices[idx].stripeSessionId = data.sessionId; salvar(); }

    window.open(data.url, '_blank');
    fecharModal();
    toast('Checkout Stripe aberto! Aguardando pagamento do cliente.', 'success');

  } catch(err) {
    if(btn){ btn.disabled=false; btn.textContent='⚡ Abrir Checkout Stripe'; }
    toast('Erro ao conectar ao Stripe: ' + err.message, 'error');
    console.error('Stripe error:', err, '| URL usada:', STRIPE_FUNCTION_URL);
  }
}

async function gerarLinkPagamento(invId) {
  const inv = db.invoices.find(x=>x.id==invId); if(!inv) return;
  const c = db.clientes.find(x=>x.id==inv.clienteId);

  const STRIPE_FUNCTION_URL = isNetlify
    ? '/.netlify/functions/create-checkout'
    : (s.stripeFunction || 'https://alumicraft-stripe.netlify.app/.netlify/functions/create-checkout');
  try {
    const resp = await fetch(STRIPE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount:      inv.total,
        invoiceId:   inv.id,
        invoiceNum:  invNumero(inv),

async function enviarInvoiceEmail(invId) {
  const inv = db.invoices.find(x=>x.id==invId); if(!inv) return;
  const c = db.clientes.find(x=>x.id==inv.clienteId);
  if(!c?.email){ toast('⚠️ Cliente sem email cadastrado! Adicione o email no cadastro do cliente.', 'error'); return; }
  const s = db.settings;
  const isNetlify = window.location.hostname.includes('netlify.app') || window.location.hostname.includes('alumicraft');
  const BASE = isNetlify ? '' : 'https://alumicraft-stripe.netlify.app';
  toast('⏳ Preparando email...', 'info');
  try {
    // Gera link Stripe se ainda não existe e gateway está configurado
    let payLink = inv.stripePayLink || null;
    if (!payLink && s.gateway === 'stripe_netlify') {
      try {
        const r = await fetch(BASE + '/.netlify/functions/create-checkout', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            amount: inv.total, invoiceId: inv.id, invoiceNum: invNumero(inv),
            clientName: c.nome, clientEmail: c.email, servico: servicoLabel(inv.servico),
            successUrl: 'https://alumicraft-stripe.netlify.app/aluminumpro.html?paid=' + inv.id,
            cancelUrl:  'https://alumicraft-stripe.netlify.app/aluminumpro.html'
          })
        });
        const d = await r.json();
        if (!d.error && d.url) {
          payLink = d.url;
          const idx = db.invoices.findIndex(x=>x.id==invId);
          if(idx>=0){ db.invoices[idx].stripePayLink = d.url; db.invoices[idx].stripeSessionId = d.sessionId; salvar(); }
        }
      } catch(e) { /* segue sem link se falhar */ }
    }
    // Envia o email
    toast('📧 Enviando email...', 'info');
    const resp = await fetch(BASE + '/.netlify/functions/send-invoice', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        to:          c.email,
        clientName:  c.nome,
        invoiceNum:  invNumero(inv),
        total:       inv.total,
        subtotal:    inv.subtotal,
        discount:    inv.desconto,
        dueDate:     fmtDate(inv.dataVenc),
        servico:     servicoLabel(inv.servico),
        payLink,
        items:       inv.itens,
        notes:       inv.notas
      })
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error);
    // Atualiza status para Enviado se era Rascunho
    const idx = db.invoices.findIndex(x=>x.id==invId);
    if(idx>=0 && db.invoices[idx].status === 'Rascunho'){
      db.invoices[idx].status = 'Enviado'; salvar(); renderInvoices();
    }
    toast(`✅ Invoice enviada para ${c.email}!`, 'success');
  } catch(err) {
    toast('Erro ao enviar email: ' + err.message, 'error');
    console.error('Email error:', err);
  }
}

// ===== FINANCIAMENTO =====
function abrirFinanciamento(orcId) {
  const o = db.orcamentos.find(x=>x.id==orcId); if(!o) return;
  const c = db.clientes.find(x=>x.id==o.clienteId);
  const s = db.settings;
  const total = orcTotal(o) - parseFloat(o.desconto||0);
  const apr = parseFloat(s.financingAPR || 18);
  const taxa = apr / 100 / 12;

  function pmt(taxa, n, pv) {
    if(taxa===0) return pv/n;
    return pv * taxa * Math.pow(1+taxa,n) / (Math.pow(1+taxa,n)-1);
  }

  const planos = [
    { meses:6,  label:'6 meses' },
    { meses:12, label:'12 meses' },
    { meses:24, label:'24 meses' },
    { meses:36, label:'36 meses' },
    { meses:60, label:'60 meses' }
  ];

  const linhas = planos.map(p => {
    const mensalidade = pmt(taxa, p.meses, total);
    const totalPago = mensalidade * p.meses;
    const juros = totalPago - total;
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:12px 8px;font-weight:700;color:var(--text)">${p.label}</td>
      <td style="padding:12px 8px;font-size:1.15rem;font-weight:800;color:#22c55e">$${mensalidade.toFixed(2)}/mo</td>
      <td style="padding:12px 8px;color:var(--text-muted);font-size:.85rem">$${totalPago.toFixed(2)}</td>
      <td style="padding:12px 8px;color:var(--danger);font-size:.85rem">+$${juros.toFixed(2)}</td>
      ${s.financingLink?`<td style="padding:12px 8px"><button class="btn btn-sm" style="background:#7c3aed;color:#fff" onclick="window.open('${s.financingLink}','_blank')">Apply</button></td>`:'<td></td>'}
    </tr>`;
  }).join('');

  const corpo = `
    <div style="text-align:center;padding:6px 0 18px">
      <div style="font-size:2rem;margin-bottom:6px">🏦</div>
      <h3 style="margin:0;color:var(--text)">Financing – Quote #${o.id}</h3>
      <p style="color:var(--text-muted);margin:4px 0 0">${c?.nome||'-'} &nbsp;·&nbsp; <strong style="color:var(--text)">${fmt(total)}</strong></p>
    </div>
    <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.83rem;color:#166534">
      📊 Simulação baseada em <strong>${apr}% APR</strong> (configurável em ⚙️ Configurações). Taxa de juros real depende do perfil de crédito do cliente.
    </div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="background:var(--bg)">
          <th style="padding:10px 8px;text-align:left;font-size:.75rem;color:var(--text-muted);text-transform:uppercase">Prazo</th>
          <th style="padding:10px 8px;text-align:left;font-size:.75rem;color:var(--text-muted);text-transform:uppercase">Parcela</th>
          <th style="padding:10px 8px;text-align:left;font-size:.75rem;color:var(--text-muted);text-transform:uppercase">Total Pago</th>
          <th style="padding:10px 8px;text-align:left;font-size:.75rem;color:var(--text-muted);text-transform:uppercase">Juros</th>
          <th style="padding:10px 8px"></th>
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    ${!s.financingLink?`<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:12px;margin-top:14px;font-size:.83rem;color:#92400e">
      ⚠️ Configure o link da sua financiadora em <strong>⚙️ Configurações → Financing Link</strong> para habilitar o botão "Apply" acima.
    </div>`:''}`;

  const footer = `
    <button class="btn btn-gray" onclick="fecharModal()">Fechar</button>
    ${s.financingLink?`<button class="btn" style="background:#7c3aed;color:#fff" onclick="window.open('${s.financingLink}','_blank')">🏦 Abrir Portal de Financiamento</button>`:''}`;

  abrirModal('🏦 Simulação de Financiamento', corpo, footer, '600px');
}

            <div id="hcp-preview-invoices" style="font-size:.8rem;margin-top:5px"></div>
          </div>
        </div>
        <div style="margin-top:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="importarHCP()" style="background:linear-gradient(135deg,#0066ff,#00b4ff)">📥 Importar para o App</button>
          <span style="font-size:.78rem;color:var(--text-muted)">Duplicatas (mesmo nome) são ignoradas automaticamente.</span>
        </div>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-primary" onclick="salvarSettings()">💾 Salvar Configurações</button>
      </div>
    </div>`;
}

function logoFileChanged(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    db.settings.logoBase64 = e.target.result;
    salvar();
    updateTopbarLogo();
    toast('Logo carregada com sucesso!', 'success');
    renderSettings();
  };
  reader.readAsDataURL(file);
}

function removerLogo() {
  if (!confirm('Remover a logo?')) return;
  db.settings.logoBase64 = '';
  salvar();
  updateTopbarLogo();
  renderSettings();
  toast('Logo removida.', 'success');
}

function updateTopbarLogo() {
  const wrap = document.getElementById('topbar-logo-wrap');
  if (!wrap) return;
  if (db.settings.logoBase64) {
    wrap.innerHTML = `<img src="${db.settings.logoBase64}" style="height:36px;max-width:140px;object-fit:contain;vertical-align:middle">`;
  } else {
    wrap.innerHTML = `<span class="badge-empresa" style="font-size:1.1rem;font-weight:800;letter-spacing:-0.3px">🏗️ AlumiCraft</span>`;
  }
}

function getLogoForPrint() {
  if (db.settings && db.settings.logoBase64) {
    return `<img src="${db.settings.logoBase64}" style="max-height:65px;max-width:220px;object-fit:contain;display:block;margin-bottom:4px">`;
  }
  return `<div style="font-size:22px;font-weight:900;color:#1a5fa8;letter-spacing:-0.5px;line-height:1">AlumiCraft</div>`;
}

function getCompanyBlock() {
  const s = db.settings || {};
  let lines = [];
  if (s.companyPhone) lines.push(`<span>📞 ${s.companyPhone}</span>`);
  if (s.companyEmail) lines.push(`<span>✉️ ${s.companyEmail}</span>`);
  if (s.companyAddress) lines.push(`<span>📍 ${s.companyAddress}</span>`);
  return lines.map(l=>`<p style="font-size:11.5px;color:#6b7a99;margin:2px 0;line-height:1.5">${l}</p>`).join('');
}

function gatewayHint(g) {
  const hints = {
    stripe_netlify: '⚡ <strong>Stripe via Netlify</strong> — Melhor opção! Taxa 2.9% + $0.30. O valor de cada invoice é pré-preenchido automaticamente no checkout. Siga o guia de 5 passos abaixo.',
    hearth: '✅ <strong>Hearth</strong> — Aceita cartão E financiamento. Crie conta em <a href="https://www.gethearth.com" target="_blank" style="color:#7c3aed">gethearth.com</a> → "Payments" → copie o Payment Link.',
    square: '🟦 <strong>Square</strong> — Crie um Payment Link em <a href="https://squareup.com/dashboard" target="_blank" style="color:#006aff">squareup.com</a> → Online Checkout → cole o link acima.',
    paypal: '🅿️ <strong>PayPal</strong> — Digite apenas seu username do PayPal.me (ex: <code>alumicraft</code>). O valor da invoice é adicionado automaticamente à URL.',
    custom: '🔗 <strong>Link Personalizado</strong> — Cole qualquer URL de pagamento. O cliente será redirecionado ao clicar em "Pay Now".'
  };
  return hints[g] || '';
}

function toggleStripeFields(g) {
  const sf = document.getElementById('field-stripeFunction');
  const pl = document.getElementById('field-paymentLink');
  const guide = document.getElementById('netlify-guide');
  if(sf) sf.style.display = g==='stripe_netlify' ? 'block' : 'none';
  if(pl) pl.style.display = g==='stripe_netlify' ? 'none' : 'block';
  if(guide) guide.style.display = g==='stripe_netlify' ? 'block' : 'none';
}

function salvarSettings() {
  const g = document.getElementById('cfg-gateway').value;
  db.settings = {
    gateway: g,
    stripeFunction: (document.getElementById('cfg-stripeFunction')?.value||'').trim(),
    paymentLink: (document.getElementById('cfg-paymentLink')?.value||'').trim(),
    financingLink: document.getElementById('cfg-financingLink').value.trim(),
    financingAPR: parseFloat(document.getElementById('cfg-financingAPR').value) || 18,
    companyPhone: document.getElementById('cfg-phone').value.trim(),
    companyEmail: document.getElementById('cfg-email').value.trim(),
    companyAddress: document.getElementById('cfg-address').value.trim(),
    logoBase64: db.settings.logoBase64 || ''
  };
  salvar();
  updateTopbarLogo();
  toast('Configurações salvas!', 'success');
}

// ===== ESTOQUE =====
let estFiltro='';
function renderEstoque() {
  const alertas=db.estoque.filter(e=>parseFloat(e.qty)<=parseFloat(e.minQty||0));
  const lista=db.estoque.filter(e=>!estFiltro||e.nome.toLowerCase().includes(estFiltro.toLowerCase())||(e.categoria||'').toLowerCase().includes(estFiltro.toLowerCase()));
  document.getElementById('content').innerHTML=`
    <div class="panel">
      <div class="panel-header"><h2>📦 Estoque (${db.estoque.length})</h2><button class="btn btn-primary" onclick="abrirModalEstoque()">+ Novo Item</button></div>
      ${alertas.length>0?`<div class="alerta-box">⚠️ <strong>${alertas.length} item(ns)</strong> abaixo do mínimo: ${alertas.map(e=>e.nome).join(', ')}</div>`:''}
      <div class="search-bar"><input type="text" placeholder="🔍 Buscar..." value="${estFiltro}" oninput="estFiltro=this.value;renderEstoque()"></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Material</th><th>Categoria</th><th>Unidade</th><th>Qtd</th><th>Mín</th><th>Custo Unit.</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody>${lista.length===0?'<tr class="empty-row"><td colspan="9">Nenhum material</td></tr>':lista.map(e=>{
          const st=parseFloat(e.qty)<=parseFloat(e.minQty||0)?'Baixo':'OK';
          return `<tr><td><strong>${e.nome}</strong>${e.fornecedor?`<br><span class="text-muted">${e.fornecedor}</span>`:''}</td><td>${e.categoria||'-'}</td><td>${e.unidade||'-'}</td>
          <td style="${st==='Baixo'?'color:var(--danger);font-weight:600':''}">${e.qty}</td><td>${e.minQty||0}</td>
          <td>${fmt(e.custo)}</td><td>${fmt(parseFloat(e.qty||0)*parseFloat(e.custo||0))}</td><td>${statusBadge(st)}</td>
          <td><div class="flex-gap">
            <button class="btn btn-sm btn-gray" onclick="ajustarEstoque(${e.id})">±</button>
            <button class="btn btn-sm btn-outline" onclick="abrirModalEstoque(${e.id})">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deletarEstoque(${e.id})">🗑️</button>
          </div></td></tr>`;}).join('')}</tbody>
      </table></div>
    </div>`;
}

function abrirModalEstoque(id) {
  const e=id?db.estoque.find(x=>x.id==id):null;
  abrirModal(`${e?'Editar':'Novo'} Material`,`
    <div class="form-grid">
      <div class="form-group span2"><label>Nome *</label><input id="f-nome" value="${e?.nome||''}" placeholder="Ex: K-Style Gutter 5 in., Screen panel..."></div>
      <div class="form-group"><label>Categoria</label><select id="f-cat">
        ${['Gutter','Soffit','Pool Cage','Carport','Railing','Geral'].map(v=>`<option value="${v}" ${e?.categoria===v?'selected':''}>${v}</option>`).join('')}
      </select></div>
      <div class="form-group"><label>Unidade</label><select id="f-unidade">
        ${['ft','m','m²','un','kg','pç','cx','roll'].map(v=>`<option value="${v}" ${e?.unidade===v?'selected':''}>${v}</option>`).join('')}
      </select></div>
      <div class="form-group"><label>Qtd Atual</label><input type="number" id="f-qty" value="${e?.qty||0}" min="0" step="0.01"></div>
      <div class="form-group"><label>Qtd Mínima</label><input type="number" id="f-minQty" value="${e?.minQty||0}" min="0" step="0.01"></div>
      <div class="form-group"><label>Custo Unit. ($)</label><input type="number" id="f-custo" value="${e?.custo||0}" min="0" step="0.01"></div>
      <div class="form-group span2"><label>Fornecedor</label><input id="f-forn" value="${e?.fornecedor||''}" placeholder="Supplier name"></div>
    </div>`,
  `<button class="btn btn-gray" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEstoque(${id||0})">${e?'Salvar':'Cadastrar'}</button>`);
}

function salvarEstoque(id) {
  const nome=document.getElementById('f-nome').value.trim(); if(!nome){alert('Nome obrigatório!');return;}
  const obj={nome,categoria:document.getElementById('f-cat').value,unidade:document.getElementById('f-unidade').value,qty:parseFloat(document.getElementById('f-qty').value||0),minQty:parseFloat(document.getElementById('f-minQty').value||0),custo:parseFloat(document.getElementById('f-custo').value||0),fornecedor:document.getElementById('f-forn').value};
  if(id){const i=db.estoque.findIndex(x=>x.id==id);if(i>=0)db.estoque[i]={...db.estoque[i],...obj};}else{obj.id=nextId('estoque');db.estoque.push(obj);}
  salvar();fecharModal();renderEstoque();toast(id?'Material atualizado!':'Material cadastrado!','success');
}

function ajustarEstoque(id) {
  const e=db.estoque.find(x=>x.id==id); if(!e)return;
  abrirModal(`Ajustar – ${e.nome}`,`
    <p style="margin-bottom:12px;color:var(--gray4)">Atual: <strong>${e.qty} ${e.unidade}</strong></p>
    <div class="form-grid full">
      <div class="form-group"><label>Operação</label><select id="f-op"><option value="add">Entrada (+)</option><option value="sub">Saída (−)</option><option value="set">Definir exato</option></select></div>
      <div class="form-group"><label>Quantidade</label><input type="number" id="f-ajuste" value="0" min="0" step="0.01"></div>
      <div class="form-group"><label>Motivo</label><input id="f-motivo" placeholder="Compra, uso em obra..."></div>
    </div>`,
  `<button class="btn btn-gray" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarAjuste(${id})">Confirmar</button>`,'420px');
}

function confirmarAjuste(id) {
  const e=db.estoque.find(x=>x.id==id); if(!e)return;
  const op=document.getElementById('f-op').value, v=parseFloat(document.getElementById('f-ajuste').value||0);
  if(op==='add') e.qty=parseFloat(e.qty||0)+v;
  else if(op==='sub') e.qty=Math.max(0,parseFloat(e.qty||0)-v);
  else e.qty=v;
  salvar();fecharModal();renderEstoque();toast('Estoque ajustado!','success');
}
function deletarEstoque(id){if(!confirm('Remover material?'))return;db.estoque=db.estoque.filter(x=>x.id!=id);salvar();renderEstoque();}

// ===== FINANCEIRO =====
let finTab='lancamentos', finFiltro='', finTipoFiltro='', finMesFiltro='';
let cpFiltro='', cpStatusFiltro='';

function renderFinanceiro() {
  const mes=today().substring(0,7);
  const receitas=db.financeiro.filter(f=>f.tipo==='Receita').reduce((s,f)=>s+parseFloat(f.valor||0),0);
  const despesas=db.financeiro.filter(f=>f.tipo==='Despesa').reduce((s,f)=>s+parseFloat(f.valor||0),0);
  const aReceber=db.invoices.filter(i=>!['Pago','Cancelado'].includes(i.status)).reduce((s,i)=>s+parseFloat(i.total||0),0);
  const aPagar=db.contasPagar.filter(c=>c.status!=='Pago').reduce((s,c)=>s+parseFloat(c.valor||0),0);

  let tabContent='';
  if(finTab==='lancamentos') tabContent=renderLancamentos();
  else if(finTab==='receber') tabContent=renderContasReceber();
  else tabContent=renderContasPagar();

  document.getElementById('content').innerHTML=`
    <div class="fin-resumo">
      <div class="fin-card receita"><div class="label">Total Receitas</div><div class="value">${fmt(receitas)}</div></div>
      <div class="fin-card despesa"><div class="label">Total Despesas</div><div class="value">${fmt(despesas)}</div></div>
      <div class="fin-card saldo"><div class="label">A Receber</div><div class="value">${fmt(aReceber)}</div></div>
      <div class="fin-card alerta"><div class="label">A Pagar</div><div class="value">${fmt(aPagar)}</div></div>
    </div>
    <div class="panel">
      <div class="tabs">
        <button class="tab-btn ${finTab==='lancamentos'?'active':''}" onclick="finTab='lancamentos';renderFinanceiro()">📒 Lançamentos</button>
        <button class="tab-btn ${finTab==='receber'?'active':''}" onclick="finTab='receber';renderFinanceiro()">📥 Contas a Receber</button>
        <button class="tab-btn ${finTab==='pagar'?'active':''}" onclick="finTab='pagar';renderFinanceiro()">📤 Contas a Pagar</button>
      </div>
      ${tabContent}
    </div>`;
}

function renderLancamentos() {
  let lista=db.financeiro.filter(f=>(!finFiltro||(f.descricao||'').toLowerCase().includes(finFiltro.toLowerCase())||clienteNome(f.clienteId).toLowerCase().includes(finFiltro.toLowerCase()))&&(!finTipoFiltro||f.tipo===finTipoFiltro)&&(!finMesFiltro||(f.data||'').startsWith(finMesFiltro))).sort((a,b)=>b.id-a.id);
  const rec=lista.filter(f=>f.tipo==='Receita').reduce((s,f)=>s+parseFloat(f.valor||0),0);
  const dep=lista.filter(f=>f.tipo==='Despesa').reduce((s,f)=>s+parseFloat(f.valor||0),0);
  return `
    <div class="panel-header"><h2>Lançamentos (${lista.length}) <span style="font-weight:400;font-size:.85rem;color:var(--success)">+${fmt(rec)}</span> <span style="font-weight:400;font-size:.85rem;color:var(--danger)">−${fmt(dep)}</span></h2><button class="btn btn-primary" onclick="abrirModalFin()">+ Novo</button></div>
    <div class="search-bar">
      <input type="text" placeholder="🔍 Buscar..." value="${finFiltro}" oninput="finFiltro=this.value;renderFinanceiro()">
      <select onchange="finTipoFiltro=this.value;renderFinanceiro()"><option value="">Todos</option><option value="Receita" ${finTipoFiltro==='Receita'?'selected':''}>Receitas</option><option value="Despesa" ${finTipoFiltro==='Despesa'?'selected':''}>Despesas</option></select>
      <input type="month" value="${finMesFiltro}" onchange="finMesFiltro=this.value;renderFinanceiro()" style="padding:7px 11px;border:1.5px solid var(--gray2);border-radius:7px;font-size:.86rem;outline:none">
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Tipo</th><th>Data</th><th>Cliente</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${lista.length===0?'<tr class="empty-row"><td colspan="9">Nenhum lançamento</td></tr>':lista.map(f=>`<tr>
        <td><strong>#${f.id}</strong></td><td>${statusBadge(f.tipo)}</td><td>${fmtDate(f.data)}</td>
        <td>${clienteNome(f.clienteId)||'-'}</td><td>${f.categoria||'-'}</td><td>${f.descricao||'-'}</td>
        <td><strong style="color:${f.tipo==='Receita'?'var(--success)':'var(--danger)'}">${fmt(f.valor)}</strong></td>
        <td>${statusBadge(f.status)}</td>
        <td><div class="flex-gap">
          <button class="btn btn-sm btn-outline" onclick="abrirModalFin(${f.id})">✏️</button>
          <button class="btn btn-sm btn-danger" onclick="deletarFin(${f.id})">🗑️</button>
        </div></td></tr>`).join('')}</tbody>
    </table></div>`;
}

function renderContasReceber() {
  // Contas a receber = invoices não pagas
  let lista=db.invoices.filter(i=>!['Pago','Cancelado'].includes(i.status)).sort((a,b)=>a.dataVenc>b.dataVenc?1:-1);
  if(cpFiltro) lista=lista.filter(i=>clienteNome(i.clienteId).toLowerCase().includes(cpFiltro.toLowerCase())||invNumero(i).includes(cpFiltro));
  const vencidas=lista.filter(i=>invStatusAtual(i)==='Vencido');
  return `
    <div class="panel-header"><h2>Contas a Receber (${lista.length})</h2><button class="btn btn-primary" onclick="abrirModalInvoice();finTab='receber'">+ Nova Invoice</button></div>
    ${vencidas.length>0?`<div class="alerta-box">⚠️ ${vencidas.length} invoice(s) vencida(s)! Total: ${fmt(vencidas.reduce((s,i)=>s+parseFloat(i.total||0),0))}</div>`:''}
    <div class="search-bar"><input type="text" placeholder="🔍 Buscar cliente ou nº..." value="${cpFiltro}" oninput="cpFiltro=this.value;renderFinanceiro()"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Invoice</th><th>Cliente</th><th>Serviço</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${lista.length===0?'<tr class="empty-row"><td colspan="7">Nenhuma conta a receber</td></tr>':lista.map(i=>`<tr>
        <td><strong class="inv-num">${invNumero(i)}</strong></td>
        <td>${clienteNome(i.clienteId)}</td><td>${servicoLabel(i.servico)}</td>
        <td style="${invStatusAtual(i)==='Vencido'?'color:var(--danger);font-weight:600':''}">${fmtDate(i.dataVenc)}</td>
        <td><strong>${fmt(i.total)}</strong></td><td>${statusBadge(invStatusAtual(i))}</td>
        <td><div class="flex-gap">
          <button class="btn btn-sm btn-success" onclick="marcarPago(${i.id})">✅ Recebido</button>
          <button class="btn btn-sm btn-gray" onclick="imprimirInvoice(${i.id})">🖨️</button>
        </div></td></tr>`).join('')}</tbody>
    </table></div>`;
}

function renderContasPagar() {
  let lista=db.contasPagar.filter(c=>(!cpStatusFiltro||c.status===cpStatusFiltro)&&(!cpFiltro||(c.descricao||'').toLowerCase().includes(cpFiltro.toLowerCase())||(c.fornecedor||'').toLowerCase().includes(cpFiltro.toLowerCase()))).sort((a,b)=>a.dataVenc>b.dataVenc?1:-1);
  const vencidas=lista.filter(c=>c.status!=='Pago'&&c.dataVenc<today());
  const total=lista.filter(c=>c.status!=='Pago').reduce((s,c)=>s+parseFloat(c.valor||0),0);
  return `
    <div class="panel-header"><h2>Contas a Pagar (${lista.length}) – ${fmt(total)} pendente</h2><button class="btn btn-primary" onclick="abrirModalCP()">+ Nova Conta</button></div>
    ${vencidas.length>0?`<div class="alerta-box">⚠️ ${vencidas.length} conta(s) vencida(s)! Total: ${fmt(vencidas.reduce((s,c)=>s+parseFloat(c.valor||0),0))}</div>`:''}
    <div class="search-bar">
      <input type="text" placeholder="🔍 Buscar fornecedor ou descrição..." value="${cpFiltro}" oninput="cpFiltro=this.value;renderFinanceiro()">
      <select onchange="cpStatusFiltro=this.value;renderFinanceiro()"><option value="">Todos status</option><option value="Aberto">Aberto</option><option value="Pago">Pago</option><option value="Vencido">Vencido</option></select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Descrição</th><th>Fornecedor</th><th>Categoria</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${lista.length===0?'<tr class="empty-row"><td colspan="8">Nenhuma conta a pagar</td></tr>':lista.map(c=>{
        const st=c.status==='Pago'?'Pago':c.dataVenc<today()?'Vencido':'Aberto';
        return `<tr>
          <td><strong>#${c.id}</strong></td><td>${c.descricao||'-'}</td><td>${c.fornecedor||'-'}</td><td>${c.categoria||'-'}</td>
          <td style="${st==='Vencido'?'color:var(--danger);font-weight:600':''}">${fmtDate(c.dataVenc)}</td>
          <td><strong>${fmt(c.valor)}</strong></td><td>${statusBadge(st)}</td>
          <td><div class="flex-gap">
            <button class="btn btn-sm btn-outline" onclick="abrirModalCP(${c.id})">✏️</button>
            ${c.status!=='Pago'?`<button class="btn btn-sm btn-success" onclick="pagarConta(${c.id})">✅ Pagar</button>`:''}
            <button class="btn btn-sm btn-danger" onclick="deletarCP(${c.id})">🗑️</button>
          </div></td></tr>`;}).join('')}</tbody>
    </table></div>`;
}

// Lançamentos
function abrirModalFin(id) {
  const f=id?db.financeiro.find(x=>x.id==id):null;
  const clientesOpts=db.clientes.map(c=>`<option value="${c.id}" ${f?.clienteId==c.id?'selected':''}>${c.nome}</option>`).join('');
  abrirModal(`${f?'Editar':'Novo'} Lançamento`,`
    <div class="form-grid">
      <div class="form-group"><label>Tipo *</label><select id="f-tipo"><option value="Receita" ${f?.tipo==='Receita'?'selected':''}>Receita</option><option value="Despesa" ${f?.tipo==='Despesa'?'selected':''}>Despesa</option></select></div>
      <div class="form-group"><label>Status</label><select id="f-status"><option value="Aberto" ${f?.status==='Aberto'?'selected':''}>Aberto</option><option value="Pago" ${f?.status==='Pago'?'selected':''}>Pago</option><option value="Vencido" ${f?.status==='Vencido'?'selected':''}>Vencido</option></select></div>
      <div class="form-group"><label>Data</label><input type="date" id="f-data" value="${f?.data||today()}"></div>
      <div class="form-group"><label>Valor ($) *</label><input type="number" id="f-valor" value="${f?.valor||0}" min="0" step="0.01"></div>
      <div class="form-group"><label>Cliente</label><select id="f-clienteId"><option value="">Nenhum</option>${clientesOpts}</select></div>
      <div class="form-group"><label>Categoria</label><select id="f-cat">

// ===== INDEXEDDB FILE STORAGE =====
const IDB_NAME='alumicraft_files',IDB_VER=1,IDB_STORE='files';
function idbOpen(){return new Promise((res,rej)=>{const req=indexedDB.open(IDB_NAME,IDB_VER);req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE,{keyPath:'id'});req.onsuccess=e=>res(e.target.result);req.onerror=rej;});}
async function idbSave(id,blob){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put({id,blob});tx.oncomplete=res;tx.onerror=rej;});}
async function idbGet(id){const db=await idbOpen();return new Promise((res,rej)=>{const req=db.transaction(IDB_STORE).objectStore(IDB_STORE).get(id);req.onsuccess=e=>res(e.target.result?.blob);req.onerror=rej;});}
async function idbDel(id){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(id);tx.oncomplete=res;tx.onerror=rej;});}

let _pendingAnexos=[];

function _anexoEntityKey(type){return type==='orc'?'orcamentos':type==='ordem'?'ordens':'invoices';}

function iniciarAnexos(){_pendingAnexos=[];}

function renderAnexoSection(type,id){
  const key=_anexoEntityKey(type);

    <div class="anexo-item" id="anexo-s-${a.id}">
      ${a.type.startsWith('image/')?
        `<img class="anexo-thumb" src="" data-idbid="${a.id}" alt="${a.name}" title="${a.name}" onclick="viewAnexo('${a.id}','${a.name}','${a.type}')">`:
        `<div class="anexo-file" onclick="viewAnexo('${a.id}','${a.name}','${a.type}')"><span class="af-icon">${a.type==='application/pdf'?'📄':'📁'}</span><span class="af-ext">${a.name.split('.').pop().toUpperCase()}</span><span class="af-name">${a.name}</span></div>`
      }
      <button class="anexo-del" onclick="removerAnexoSalvo('${type}',${id},'${a.id}')" title="Remover">✕</button>
